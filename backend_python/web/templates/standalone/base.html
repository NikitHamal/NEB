{% load static %}
{% load web_extras %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script nonce="{{ csp_nonce }}">
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Standalone{% endblock %} | NEBians</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'web/img/favicon.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'web/img/n-logo-32.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'web/img/n-logo-180.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap">
  <link rel="stylesheet" href="{% static 'web/css/material3.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <script nonce="{{ csp_nonce }}">
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      if (isDark) { html.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
      else { html.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
    }
    function snackbar(msg, duration) {
      duration = duration || 4000;
      var container = document.getElementById('snackbar-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'snackbar-container';
        container.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
        document.body.appendChild(container);
      }
      var el = document.createElement('div');
      el.style.cssText = 'background:var(--md-inverse-surface,#333);color:var(--md-inverse-on-surface,#fff);padding:10px 20px;border-radius:8px;font:500 .875rem/1.4 Poppins,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:fadeInUp .2s ease-out;pointer-events:auto';
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(function() { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; setTimeout(function() { el.remove(); }, 200); }, duration);
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
