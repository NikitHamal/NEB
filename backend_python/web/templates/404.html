{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="error-state">
  <div class="error-bg-glow error-bg-glow-1"></div>
  <div class="error-bg-glow error-bg-glow-2"></div>
  
  <div class="error-state-card">
    <div class="error-state-icon-container error-state-icon-container-404">
      <span class="material-symbols-outlined">explore_off</span>
    </div>
    <h1 class="error-state-title">Page Not Found</h1>
    <p class="error-state-desc">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{% url 'web:home' %}" class="error-state-btn">
      <span class="material-symbols-outlined">home</span>
      Go Home
    </a>
  </div>
</div>
{% endblock %}
