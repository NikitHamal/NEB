{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}



{% block content %}
<div class="error-container">
  <div class="error-code">
    <span class="error-code-digit">4</span>0<span class="error-code-digit">4</span>
  </div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-text">The page you're looking for doesn't exist, has been removed, or was moved to another URL.</p>
  <div class="error-actions">
    <a href="{% url 'web:home' %}" class="md-btn md-btn-filled error-btn">
      <span class="material-symbols-outlined">home</span>
      Go Home
    </a>
    <button onclick="history.back()" class="md-btn md-btn-outlined error-btn">
      <span class="material-symbols-outlined">arrow_back</span>
      Go Back
    </button>
  </div>
</div>
{% endblock %}
