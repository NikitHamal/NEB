{% extends 'admin_panel/base.html' %}
{% load static %}
{% block title %}Media Test — TTS{% endblock %}
{% block content %}
<div class="admin-page-header">
  <h1>TTS Providers</h1>
  <p class="md-body-small" style="color:var(--md-on-surface-variant)">Test free no-signup TTS — LazyPy (Bing/Google/iSpeech), Google direct, Moe, Kokoro, Chatterbox, Fish.</p>
</div>

<div class="admin-section-card" style="max-width:720px">
  <label>Provider
    <select id="tts-provider" class="md-input">
      <option value="lazypy/bing-translator">LazyPy Bing (Microsoft) — 313 voices, 3000 chars</option>
      <option value="lazypy/google-translate">LazyPy Google — 64 voices, 200 chars</option>
      <option value="lazypy/ispeech">LazyPy iSpeech — 41 voices, 600 chars</option>
      <option value="google/translate-en">Google Translate (direct) — auto-chunked</option>
      <option value="moe/moe-tts">Moe TTS — anime</option>
      <option value="kokoro/kokoro-82m">Kokoro 82M — warm natural</option>
      <option value="kokoro/kokoro-82m-af-bella">Kokoro Bella — bright female</option>
      <option value="chatterbox/chatterbox">Chatterbox — expressive</option>
      <option value="fishaudio/s1">Fish Audio S1 — high quality</option>
    </select>
  </label>
  <label>Voice <span class="md-body-small" style="color:var(--md-on-surface-variant)">Optional — e.g. en-US-JennyNeural (Bing), en-gb (Google), Hoshino (Moe), af_heart (Kokoro)</span>
    <input id="tts-voice" class="md-input" placeholder="default">
  </label>
  <label>Text
    <textarea id="tts-text" class="md-input" rows="3">Hello from NEBians! This is a test of our free TTS providers.</textarea>
  </label>
  <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
    <button id="tts-generate" class="md-btn md-btn-filled"><span class="material-symbols-outlined">mic</span>Synthesize</button>
    <span id="tts-status" class="admin-status-line"></span>
  </div>
  <div id="tts-result" class="admin-media-preview" style="display:none">
    <div class="admin-media-meta">
      <span id="tts-meta"></span>
      <a id="tts-download" href="#" download="tts.mp3" class="md-btn md-btn-text">Download</a>
    </div>
    <audio id="tts-audio" controls></audio>
  </div>
</div>

<div class="admin-section-card" style="max-width:720px;margin-top:12px">
  <h4 style="margin:0 0 6px">Registered models</h4>
  <ul id="tts-model-list" class="admin-model-list"></ul>
</div>

<script nonce="{{ csp_nonce }}">
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var CSRF = '{{ csrf_token }}';

  function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || r.statusText);
        return data;
      });
    });
  }

  var ttsModels = JSON.parse('{{ tts_models_json|escapejs }}');
  var list = $('tts-model-list');
  ttsModels.forEach(function (m) {
    var li = document.createElement('li');
    li.innerHTML = '<code>' + m.id + '</code> — ' + (m.note || m.label);
    list.appendChild(li);
  });

  $('tts-generate').addEventListener('click', function () {
    var text = $('tts-text').value.trim();
    if (!text) { setStatus('tts-status', 'Text required', 'err'); return; }
    var provider = $('tts-provider').value;
    var voice = $('tts-voice').value.trim();
    var body = { provider: provider, text: text, voice: voice };
    if (provider.indexOf('lazypy') === 0) {
      body.service = provider.indexOf('google') >= 0 ? 'Google Translate' : provider.indexOf('ispeech') >= 0 ? 'iSpeech' : 'Bing Translator';
    } else if (provider.indexOf('google') === 0) {
      body.lang = voice || 'en';
    } else if (provider.indexOf('moe') === 0) {
      body.speaker = voice || 'Hoshino';
    } else if (provider.indexOf('kokoro') === 0) {
      body.voice = voice || '';
    } else if (provider.indexOf('chatterbox') === 0) {
      body.voice = voice || '';
    } else if (provider.indexOf('fish') === 0) {
      body.voice = voice || 'default';
    }
    setStatus('tts-status', 'Synthesizing…');
    $('tts-generate').disabled = true;
    $('tts-result').style.display = 'none';
    post('/ajax/admin/media/tts/', body)
      .then(function (data) {
        var src = data.dataUrl || data.audioUrl || '';
        if (src.indexOf('/') === 0) src = 'https://lazypy.ro' + src;
        if (src.indexOf('data:') === 0) src = dataUrlToBlobUrl(src);
        setStatus('tts-status', 'Done — ' + [data.provider, data.service, data.voice].filter(Boolean).join(' · ') + ' · ' + (data.bytes || 0) + ' bytes', 'ok');
        $('tts-meta').textContent = [data.provider, data.service, data.voice].filter(Boolean).join(' · ');
        $('tts-audio').src = src;
        $('tts-download').href = src;
        $('tts-result').style.display = '';
        try { $('tts-audio').play(); } catch(e) {}
      })
      .catch(function (err) { setStatus('tts-status', err.message, 'err'); })
      .finally(function () { $('tts-generate').disabled = false; });
  });

  function setStatus(id, msg, kind) {
    var el = $(id);
    el.textContent = msg;
    el.className = 'admin-status-line' + (kind ? ' ' + kind : '');
  }

  function dataUrlToBlobUrl(dataUrl) {
    try {
      var parts = dataUrl.split(',', 2);
      var mime = (parts[0].match(/data:([^;]+)/) || [])[1] || 'audio/mpeg';
      var bin = atob(parts[1]);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([bytes], { type: mime }));
    } catch (e) { return dataUrl; }
  }
})();
</script>
{% endblock %}
