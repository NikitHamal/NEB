{% load admin_extras %}
{% admin_nav active_page as groups %}
{% for group in groups %}
<div class="admin-nav-group">
  <div class="admin-nav-group-label">{{ group.label }}</div>
  {% for item in group.items %}
  <a href="{{ item.url }}" class="admin-nav-item{% if item.active %} active{% endif %}" data-nav="{{ item.label }}"{% if item.active %} aria-current="page"{% endif %}>
    <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
    <span class="admin-nav-text">{{ item.label }}</span>
    {% if item.badge %}<span class="admin-nav-badge">{{ item.badge }}</span>{% endif %}
  </a>
  {% endfor %}
</div>
{% endfor %}
