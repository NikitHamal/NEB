<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NEBians</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'web/img/favicon.svg' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'web/img/favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'web/css/material3.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  <style>
    body { display:flex;align-items:center;justify-content:center;min-height:100vh; }
  </style>
</head>
<body>
  <div class="md-card-elevated" style="width:100%;max-width:400px;padding:40px 32px;text-align:center;">
    <div style="display:flex;justify-content:center;margin-bottom:24px;">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="64" height="64" aria-label="NEBians">
        <defs>
          <linearGradient id="frontGrad" x1="40" y1="220" x2="800" y2="1350" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0058df"/><stop offset="0.48" stop-color="#004bd4"/><stop offset="1" stop-color="#003cc3"/></linearGradient>
          <linearGradient id="darkGrad" x1="505" y1="30" x2="960" y2="1290" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07337f"/><stop offset="0.55" stop-color="#052566"/><stop offset="1" stop-color="#021b54"/></linearGradient>
          <linearGradient id="innerGrad" x1="435" y1="180" x2="780" y2="890" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06327c"/><stop offset="1" stop-color="#04215e"/></linearGradient>
          <linearGradient id="lightGrad" x1="305" y1="320" x2="615" y2="705" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8c5ff"/><stop offset="0.52" stop-color="#90b4fb"/><stop offset="1" stop-color="#82a8f5"/></linearGradient>
          <linearGradient id="frontShadowGrad" x1="690" y1="780" x2="780" y2="1050" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0030a5" stop-opacity="0.35"/><stop offset="1" stop-color="#001e77" stop-opacity="0"/></linearGradient>
        </defs>
        <g transform="translate(210.601 86.137) scale(0.610119)">
          <g fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"><path d="M500 42 L501 135 L856 370 L858 1287 L943 1219 L943 331 Z"/><path d="M441 191 L441 282 L691 447 L691 799 L774 886 L775 408 Z"/><path d="M306 320 L307 377 L613 706 L613 485 Z"/><path d="M51 228 L51 1132 L263 1346 L267 812 L775 1353 L775 887 L691 800 L685 902 Z"/></g>
          <g stroke-linejoin="round" stroke-linecap="round"><path d="M500 42 L501 135 L856 370 L858 1287 L943 1219 L943 331 Z" fill="url(#darkGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M441 191 L441 282 L691 447 L691 799 L774 886 L775 408 Z" fill="url(#innerGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M306 320 L307 377 L613 706 L613 485 Z" fill="url(#lightGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M51 228 L51 1132 L263 1346 L267 812 L775 1353 L775 887 L691 800 L685 902 Z" fill="url(#frontGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M691 800 L775 887 L775 1052 L691 958 Z" fill="url(#frontShadowGrad)" stroke="none"/></g>
        </g>
      </svg>
    </div>
    <h1 class="md-headline-small" style="margin-bottom:8px;">Admin Panel</h1>
    <p class="md-body-medium" style="color:var(--md-on-surface-variant);margin-bottom:32px;">Sign in to manage NEBians</p>

    {% if error %}
    <div style="background:var(--md-error-container);color:var(--md-on-error-container);padding:12px 16px;border-radius:var(--md-radius-sm);margin-bottom:16px;font-size:0.875rem;">
      {{ error }}
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="md-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="md-input" placeholder="Admin username" required autofocus>
      </div>
      <div class="form-group">
        <label class="md-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="md-input" placeholder="Password" required>
      </div>
      <button type="submit" class="md-btn md-btn-filled" style="width:100%;margin-top:8px;">
        <span class="material-symbols-outlined" style="font-size:18px">login</span>
        Sign In
      </button>
    </form>
  </div>
</body>
</html>
