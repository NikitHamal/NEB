{% extends "base.html" %}

{% block title %}Reply{% endblock %}
{% block nav_forum %}md-nav-active{% endblock %}

{% block content %}
<div class="md-container-narrow page-pad-top">
  <a href="{% url 'web:forum_post' post_id=post_id %}" class="md-btn md-btn-text mb-2 btn-left-flush">
    <span class="material-symbols-outlined icon-md">arrow_back</span>
    Back to Post
  </a>

  <h1 class="md-headline-small mb-3">Reply</h1>

  {% if post %}
  <div class="md-card p-2 mb-3 surface-note">
    <div class="md-label-medium muted mb-half">Replying to:</div>
    <div class="md-title-small">{{ post.title }}</div>
  </div>
  {% endif %}

  <div class="md-card p-3">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="md-label" for="content">Your Reply</label>
        <textarea id="content" name="content" class="md-textarea" placeholder="Write your reply..." rows="6" required></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="md-btn md-btn-filled">
          <span class="material-symbols-outlined icon-md">send</span>
          Submit Reply
        </button>
        <a href="{% url 'web:forum_post' post_id=post_id %}" class="md-btn md-btn-text">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
