{% extends "base.html" %}

{% block title %}Verify Your Email — NEBians{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card md-card-elevated">
    <div class="logo" style="display:flex;justify-content:center;">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="80" height="80" aria-label="NEBians">
        <defs>
          <linearGradient id="frontGrad" x1="40" y1="220" x2="800" y2="1350" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0058df"/><stop offset="0.48" stop-color="#004bd4"/><stop offset="1" stop-color="#003cc3"/></linearGradient>
          <linearGradient id="darkGrad" x1="505" y1="30" x2="960" y2="1290" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07337f"/><stop offset="0.55" stop-color="#052566"/><stop offset="1" stop-color="#021b54"/></linearGradient>
          <linearGradient id="innerGrad" x1="435" y1="180" x2="780" y2="890" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06327c"/><stop offset="1" stop-color="#04215e"/></linearGradient>
          <linearGradient id="lightGrad" x1="305" y1="320" x2="615" y2="705" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8c5ff"/><stop offset="0.52" stop-color="#90b4fb"/><stop offset="1" stop-color="#82a8f5"/></linearGradient>
          <linearGradient id="frontShadowGrad" x1="690" y1="780" x2="780" y2="1050" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0030a5" stop-opacity="0.35"/><stop offset="1" stop-color="#001e77" stop-opacity="0"/></linearGradient>
        </defs>
        <g transform="translate(210.601 86.137) scale(0.610119)">
          <g fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
            <path d="M500 42 L501 135 L856 370 L858 1287 L943 1219 L943 331 Z"/><path d="M441 191 L441 282 L691 447 L691 799 L774 886 L775 408 Z"/><path d="M306 320 L307 377 L613 706 L613 485 Z"/><path d="M51 228 L51 1132 L263 1346 L267 812 L775 1353 L775 887 L691 800 L685 902 Z"/>
          </g>
          <g stroke-linejoin="round" stroke-linecap="round">
            <path d="M500 42 L501 135 L856 370 L858 1287 L943 1219 L943 331 Z" fill="url(#darkGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M441 191 L441 282 L691 447 L691 799 L774 886 L775 408 Z" fill="url(#innerGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M306 320 L307 377 L613 706 L613 485 Z" fill="url(#lightGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M51 228 L51 1132 L263 1346 L267 812 L775 1353 L775 887 L691 800 L685 902 Z" fill="url(#frontGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M691 800 L775 887 L775 1052 L691 958 Z" fill="url(#frontShadowGrad)" stroke="none"/>
          </g>
        </g>
      </svg>
    </div>
    <h1 class="md-headline-small">Verify Your Email</h1>
    <p class="md-body-medium">We sent a 6-digit code to <strong id="verify-email-display"></strong></p>

    <div style="margin-top:20px;">
      <div class="md-text-field-wrapper">
        <input type="text" id="verify-code" class="md-text-field" placeholder=" " required maxlength="6" pattern="[0-9]{6}" inputmode="numeric">
        <label class="md-text-field-label">6-digit Code</label>
      </div>
      <p id="verify-error" style="color:var(--md-error);font-size:0.8125rem;min-height:1.2em;margin:4px 0;"></p>
      <button data-action="verify-email" id="verify-btn" class="md-btn md-btn-filled" style="width:100%;margin-top:8px;">Verify</button>
      <button data-action="resend-verify-code" id="resend-btn" class="md-btn md-btn-text" style="width:100%;margin-top:4px;">Resend Code</button>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <a href="{% url 'web:email_login' %}" class="md-btn md-btn-text">← Back to sign in</a>
    </div>
  </div>
</div>

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
var params = new URLSearchParams(window.location.search);
var email = params.get('email') || '';
document.getElementById('verify-email-display').textContent = email || 'your email';

function handleVerify() {
  var code = document.getElementById('verify-code').value.trim();
  var errorEl = document.getElementById('verify-error');
  var btn = document.getElementById('verify-btn');
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  fetch('/api/auth/email/verify/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, code: code })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' && data.authToken) {
      fetch('{% url "web:google_auth" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        body: JSON.stringify({ emailAuthToken: data.authToken, emailUser: data.user })
      }).then(function() {
        window.location.href = data.isNewUser ? '{% url "web:edit_profile" %}' : '{% url "web:home" %}';
      });
    } else {
      errorEl.textContent = data.error || 'Verification failed';
      btn.disabled = false;
      btn.textContent = 'Verify';
    }
  }).catch(function() {
    errorEl.textContent = 'Network error. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Verify';
  });
}

function handleResend() {
  var btn = document.getElementById('resend-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  fetch('/api/auth/email/resend/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' || !data.error) {
      var seconds = 60;
      btn.textContent = 'Resend in ' + seconds + 's';
      var timer = setInterval(function() {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          btn.textContent = 'Resend Code';
          btn.disabled = false;
        } else {
          btn.textContent = 'Resend in ' + seconds + 's';
        }
      }, 1000);
    } else {
      btn.textContent = 'Resend Code';
      btn.disabled = false;
    }
  }).catch(function() { btn.textContent = 'Resend Code'; btn.disabled = false; });
}

registerActions({
  'verify-email': function() { handleVerify(); },
  'resend-verify-code': function() { handleResend(); }
});
</script>
{% endblock %}
{% endblock %}
