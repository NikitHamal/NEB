{% extends "base.html" %}

{% block title %}Verify Email{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card md-card-elevated">
    <h1 class="md-headline-small">Verify Your Email</h1>
    <p class="md-body-medium">We sent a 6-digit code to <strong id="verify-email-display"></strong></p>

    <div style="margin-top:20px;">
      <div class="md-text-field-wrapper">
        <input type="text" id="verify-code" class="md-text-field" placeholder=" " required maxlength="6" pattern="[0-9]{6}" inputmode="numeric">
        <label class="md-text-field-label">6-digit Code</label>
      </div>
      <p id="verify-error" style="color:var(--md-error);font-size:0.8125rem;min-height:1.2em;margin:4px 0;"></p>
      <button data-action="verify-email" id="verify-btn" class="md-btn md-btn-filled" style="width:100%;margin-top:8px;">Verify</button>
      <button data-action="resend-verify-code" id="resend-btn" class="md-btn md-btn-text" style="width:100%;margin-top:4px;">Resend Code</button>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <a href="{% url 'web:email_login' %}" class="md-btn md-btn-text">← Back to sign in</a>
    </div>
  </div>
</div>

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
var params = new URLSearchParams(window.location.search);
var email = params.get('email') || '';
document.getElementById('verify-email-display').textContent = email || 'your email';

function handleVerify() {
  var code = document.getElementById('verify-code').value.trim();
  var errorEl = document.getElementById('verify-error');
  var btn = document.getElementById('verify-btn');
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  fetch('/api/auth/email/verify/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, code: code })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' && data.authToken) {
      fetch('{% url "web:google_auth" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        body: JSON.stringify({ emailAuthToken: data.authToken, emailUser: data.user })
      }).then(function() {
        window.location.href = data.isNewUser ? '{% url "web:edit_profile" %}' : '{% url "web:home" %}';
      });
    } else {
      errorEl.textContent = data.error || 'Verification failed';
      btn.disabled = false;
      btn.textContent = 'Verify';
    }
  }).catch(function() {
    errorEl.textContent = 'Network error. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Verify';
  });
}

function handleResend() {
  var btn = document.getElementById('resend-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  fetch('/api/auth/email/resend/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' || !data.error) {
      var seconds = 60;
      btn.textContent = 'Resend in ' + seconds + 's';
      var timer = setInterval(function() {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          btn.textContent = 'Resend Code';
          btn.disabled = false;
        } else {
          btn.textContent = 'Resend in ' + seconds + 's';
        }
      }, 1000);
    } else {
      btn.textContent = 'Resend Code';
      btn.disabled = false;
    }
  }).catch(function() { btn.textContent = 'Resend Code'; btn.disabled = false; });
}

registerActions({
  'verify-email': function() { handleVerify(); },
  'resend-verify-code': function() { handleResend(); }
});
</script>
{% endblock %}
{% endblock %}
