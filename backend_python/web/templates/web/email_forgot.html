{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card md-card-elevated">
    <h1 id="forgot-title" class="md-headline-small">Reset Password</h1>
    <p id="forgot-subtitle" class="md-body-medium">Enter your email to receive a verification code.</p>

    <div style="margin-top:20px;">
      <div class="md-text-field-wrapper">
        <input type="email" id="forgot-email" class="md-text-field" placeholder=" " required>
        <label class="md-text-field-label">Email</label>
      </div>
      <p id="forgot-error" style="color:var(--md-error);font-size:0.8125rem;min-height:1.2em;margin:4px 0;"></p>
      <button data-action="forgot-send-code" id="forgot-btn" class="md-btn md-btn-filled" style="width:100%;margin-top:8px;">Send Code</button>
    </div>

    <div id="reset-section" style="display:none;margin-top:20px;">
      <p id="reset-instruction" style="font-size:0.875rem;color:var(--md-on-surface-variant);margin-bottom:12px;">Enter the code and your new password.</p>
      <div class="md-text-field-wrapper">
        <input type="text" id="reset-code" class="md-text-field" placeholder=" " required maxlength="6" inputmode="numeric">
        <label class="md-text-field-label">6-digit Code</label>
      </div>
      <div class="md-text-field-wrapper" style="margin-top:12px;">
        <input type="password" id="reset-password" class="md-text-field" placeholder=" " required minlength="8">
        <label id="reset-password-label" class="md-text-field-label">New Password</label>
      </div>
      <div class="md-text-field-wrapper" style="margin-top:12px;">
        <input type="password" id="reset-confirm-password" class="md-text-field" placeholder=" " required minlength="8">
        <label class="md-text-field-label">Confirm Password</label>
      </div>
      <p id="reset-error" style="color:var(--md-error);font-size:0.8125rem;min-height:1.2em;margin:4px 0;"></p>
      <button data-action="forgot-reset-password" id="reset-submit-btn" class="md-btn md-btn-filled" style="width:100%;margin-top:8px;">Reset Password</button>
      <div style="margin-top:8px;text-align:center;">
        <button data-action="forgot-resend-code" id="forgot-resend-btn" class="md-btn md-btn-text" style="display:none;">Resend Code</button>
      </div>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <a href="{% url 'web:email_login' %}" class="md-btn md-btn-text">← Back to sign in</a>
    </div>
  </div>
</div>

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
var _needsSetPassword = false;

function handleForgot() {
  var email = document.getElementById('forgot-email').value.trim();
  var errorEl = document.getElementById('forgot-error');
  var btn = document.getElementById('forgot-btn');
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Sending...';

  fetch('/api/auth/email/forgot/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' || !data.error) {
      _needsSetPassword = !!data.needsSetPassword;
      if (_needsSetPassword) {
        document.getElementById('forgot-title').textContent = 'Set Password';
        document.getElementById('forgot-subtitle').textContent = 'This account uses Google sign-in. Set a password to also sign in with email.';
        document.getElementById('reset-password-label').textContent = 'New Password';
        document.getElementById('reset-instruction').textContent = 'Enter the code and choose a password.';
        document.getElementById('reset-submit-btn').textContent = 'Set Password';
      } else {
        document.getElementById('forgot-title').textContent = 'Reset Password';
        document.getElementById('forgot-subtitle').textContent = 'Enter your email to receive a verification code.';
        document.getElementById('reset-password-label').textContent = 'New Password';
        document.getElementById('reset-instruction').textContent = 'Enter the code and your new password.';
        document.getElementById('reset-submit-btn').textContent = 'Reset Password';
      }
      document.getElementById('reset-section').style.display = 'block';
      document.getElementById('forgot-resend-btn').style.display = '';
      btn.textContent = 'Code Sent!';
      btn.disabled = true;
    } else {
      errorEl.textContent = data.error || 'Failed to send code';
      btn.textContent = 'Send Code';
      btn.disabled = false;
    }
  }).catch(function() {
    errorEl.textContent = 'Network error. Please try again.';
    btn.textContent = 'Send Code';
    btn.disabled = false;
  });
}

function handleReset() {
  var email = document.getElementById('forgot-email').value.trim();
  var code = document.getElementById('reset-code').value.trim();
  var newPassword = document.getElementById('reset-password').value;
  var confirmPassword = document.getElementById('reset-confirm-password').value;
  var errorEl = document.getElementById('reset-error');
  errorEl.textContent = '';

  if (newPassword !== confirmPassword) {
    errorEl.textContent = 'Passwords do not match';
    return;
  }

  fetch('/api/auth/email/reset-password/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, code: code, newPassword: newPassword, confirmPassword: confirmPassword })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' && data.authToken) {
      fetch('{% url "web:google_auth" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        body: JSON.stringify({ emailAuthToken: data.authToken, emailUser: data.user })
      }).then(function() {
        window.location.href = '{% url "web:home" %}';
      });
    } else {
      errorEl.textContent = data.error || 'Reset failed';
    }
  }).catch(function() {
    errorEl.textContent = 'Network error. Please try again.';
  });
}

function handleForgotResend() {
  var email = document.getElementById('forgot-email').value.trim();
  var btn = document.getElementById('forgot-resend-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  fetch('/api/auth/email/forgot/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success' || !data.error) {
      var seconds = 60;
      btn.textContent = 'Resend in ' + seconds + 's';
      var timer = setInterval(function() {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          btn.textContent = 'Resend Code';
          btn.disabled = false;
        } else {
          btn.textContent = 'Resend in ' + seconds + 's';
        }
      }, 1000);
    } else {
      btn.textContent = 'Resend Code';
      btn.disabled = false;
    }
  }).catch(function() { btn.textContent = 'Resend Code'; btn.disabled = false; });
}

registerActions({
  'forgot-send-code': function() { handleForgot(); },
  'forgot-reset-password': function() { handleReset(); },
  'forgot-resend-code': function() { handleForgotResend(); }
});
</script>
{% endblock %}
{% endblock %}
