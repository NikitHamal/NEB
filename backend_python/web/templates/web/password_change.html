{% extends "base.html" %}

{% block title %}Change Password{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<div class="md-container-narrow" style="padding-top:24px;">
  <div style="text-align:left;margin-bottom:24px;">
    <a href="{% url 'web:edit_profile' %}" class="md-btn md-btn-text" style="padding:4px 8px;margin:-4px -8px;text-decoration:none;" data-action="go-back">
      <span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;">arrow_back</span> Back to Profile
    </a>
  </div>

  <div class="md-card p-3">
    <h1 style="font-size:1.25rem;font-weight:600;margin-bottom:24px;">Change Password</h1>

    <form id="change-password-form" data-action="change-password">
      <div class="form-group">
        <label class="md-label" for="current-password">Current Password</label>
        <input type="password" id="current-password" class="md-input" placeholder=" " required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label class="md-label" for="new-password">New Password</label>
        <input type="password" id="new-password" class="md-input" placeholder=" " required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="md-label" for="confirm-new-password">Confirm New Password</label>
        <input type="password" id="confirm-new-password" class="md-input" placeholder=" " required minlength="8" autocomplete="new-password">
      </div>
      <p id="change-password-error" style="color:var(--md-error);font-size:0.8125rem;min-height:1.2em;margin:4px 0;"></p>
      <button type="submit" class="md-btn md-btn-filled" id="change-password-btn" style="width:100%;">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
function handleChangePassword(e) {
  e.preventDefault();
  var currentPassword = document.getElementById('current-password').value;
  var newPassword = document.getElementById('new-password').value;
  var confirm = document.getElementById('confirm-new-password').value;
  var errorEl = document.getElementById('change-password-error');
  var btn = document.getElementById('change-password-btn');
  errorEl.textContent = '';
  if (!currentPassword) { errorEl.textContent = 'Current password is required'; return; }
  if (newPassword.length < 8) { errorEl.textContent = 'New password must be at least 8 characters'; return; }
  if (newPassword !== confirm) { errorEl.textContent = 'Passwords do not match'; return; }
  btn.disabled = true;
  btn.textContent = 'Changing...';
  fetch('/ajax/change-password/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
    body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data.status === 'success') {
      showSnackbar('Password changed successfully!');
      document.getElementById('current-password').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-new-password').value = '';
      btn.disabled = false;
      btn.textContent = 'Change Password';
    } else {
      errorEl.textContent = data.error || 'Failed to change password';
      btn.disabled = false;
      btn.textContent = 'Change Password';
    }
  }).catch(function() {
    errorEl.textContent = 'Network error';
    btn.disabled = false;
    btn.textContent = 'Change Password';
  });
}

registerActions({
  'change-password': function(el, e) { handleChangePassword(e); }
});
</script>
{% endblock %}
