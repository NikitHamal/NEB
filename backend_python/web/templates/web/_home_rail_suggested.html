{% load web_extras %}
<section class="hf-block hf-feed-block" aria-labelledby="hf-suggested-title">
  <div class="hf-title">
    <h2 class="hf-title-text" id="hf-suggested-title">Suggested for you</h2>
    <a class="hf-title-action" href="{% url 'web:library' %}">See All</a>
  </div>
  <div class="hf-rail-wrap">
    <div class="hf-rail hscroll">
      {% for item in items|slice:":8" %}
        {% with r=item.resource %}
          {% include "web/_home_rail_resource.html" %}
        {% endwith %}
      {% endfor %}
    </div>
    <button type="button" class="hf-rail-btn hf-rail-prev" data-rail-prev aria-label="Scroll to earlier suggestions"><span class="material-symbols-outlined">chevron_left</span></button>
    <button type="button" class="hf-rail-btn hf-rail-next" data-rail-next aria-label="Scroll to more suggestions"><span class="material-symbols-outlined">chevron_right</span></button>
  </div>
</section>
