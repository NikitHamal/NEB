{% if cover_choices %}
<dialog class="cv-dialog" id="coverPicker" aria-label="Choose a cover" data-url="{% url 'web:set_cover_art' %}">
  <div class="cv-head"><h2>Choose a cover</h2><button type="button" class="cv-close" data-cv-close aria-label="Close"><span class="material-symbols-outlined">close</span></button></div>
  <div class="cv-grid" role="listbox">
    {% for c in cover_choices %}<button type="button" class="cv-pick{% if c.id == cover_art %} is-on{% endif %}" role="option" aria-selected="{% if c.id == cover_art %}true{% else %}false{% endif %}" data-cover="{{ c.id }}" aria-label="{{ c.layout|capfirst }}, {{ c.palette }}"><span class="cv-art" data-m3x-tile="{{ c.id }}"></span><span class="material-symbols-outlined cv-tick">check</span></button>{% endfor %}
  </div>
  <div class="cv-foot"><button type="button" class="pf-btn pf-btn-outlined" data-cv-reset>Default cover</button></div>
</dialog>
{% endif %}
