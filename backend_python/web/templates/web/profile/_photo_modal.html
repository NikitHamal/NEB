<!-- Photo History Modal -->
{% if user and user.username == profile_user.username %}
<div class="modal-overlay" id="photoHistoryModal" data-action="close-photo-history-modal">
  <div class="modal-box" data-action="noop">
    <div class="modal-header">
      <h3 class="modal-title">Switch Profile Photo</h3>
      <button class="modal-close" data-action="close-photo-history-modal-btn"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="modal-body">
      <div class="photos-grid" id="photosGrid">
        {% for photo in user_photos %}
          <div class="photo-thumb {% if photo.is_current %}active{% endif %}" data-action="activate-past-photo" data-photo-id="{{ photo.id }}" data-photo-url="{{ photo.url }}">
            <img src="{{ photo.url }}" alt="">
          </div>
        {% empty %}
          <div style="grid-column:span 3; text-align:center; padding:16px; color:var(--md-on-surface-variant); font-size:0.875rem;">
            No photo history yet. Paste a URL below!
          </div>
        {% endfor %}
      </div>
      <input type="file" id="modal_photo_file" class="visually-hidden-file-input" accept="image/*" data-upload-url="{% url 'web:ajax_user_photos' %}">
      <button type="button" class="photo-upload-btn" data-action="trigger-photo-upload" data-photo-input-id="modal_photo_file" aria-controls="modal_photo_file">
        <span class="material-symbols-outlined" style="font-size:16px; vertical-align:middle; margin-right:4px;">upload</span>
        Upload Image File
      </button>
      <div class="photo-url-row">
        <input type="url" id="inputNewPhotoUrl" class="photo-url-input" placeholder="https://example.com/photo.jpg">
        <button class="pf-btn-follow pf-btn-follow-filled" data-action="upload-new-photo-url" style="border-radius:10px; padding:8px 16px; font-size:0.8125rem;">Add</button>
      </div>
    </div>
  </div>
</div>
{% endif %}
