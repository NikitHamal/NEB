<!-- Share Profile Card Modal -->
<div class="modal-overlay" id="shareCardModal" data-action="close-share-card-modal">
  <div class="modal-box" data-action="noop" style="max-width:520px;">
    <div class="modal-header">
      <h3 class="modal-title">Share Profile Card</h3>
      <button class="modal-close" data-action="close-share-card-modal-btn"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="modal-body" style="padding:16px;max-height:none;overflow:visible;">
      <!-- Card Preview -->
      <div id="shareCardPreview" style="margin-bottom:16px;"></div>
      <!-- Caption -->
      <div class="share-card-caption-box">
        <label class="share-card-caption-label">Caption</label>
        <div class="share-card-caption-text" id="shareCardCaption" contenteditable="true" spellcheck="false"></div>
      </div>
      <!-- Social Buttons -->
      <div class="share-card-actions">
        <button class="share-card-btn share-card-btn-facebook" data-action="share-card-facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.413c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
        <button class="share-card-btn share-card-btn-x" data-action="share-card-x">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X
        </button>
        <button class="share-card-btn share-card-btn-download" data-action="share-card-download">
          <span class="material-symbols-outlined">download</span>
          Save Image
        </button>
        <button class="share-card-btn share-card-btn-copy" data-action="share-card-copy-link">
          <span class="material-symbols-outlined">link</span>
          Copy Link
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden Render Card (used by html2canvas) -->
<div id="shareCardRender" style="position:fixed;left:-9999px;top:0;z-index:-1;pointer-events:none;"></div>
