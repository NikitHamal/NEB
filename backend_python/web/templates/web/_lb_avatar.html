{% load web_extras %}<span class="leaderboard-avatar lb-av{% if big %} lb-av-lg{% endif %}" data-avatar-seed="{{ c.username }}">{% if c.photo_url %}<img src="{{ c.photo_url }}" alt="{{ c.display_name }}" loading="lazy" data-fallback="inline-flex"><span class="lb-av-letter" style="display:none">{{ c.display_name|truncate_chars:1 }}</span>{% else %}<span class="lb-av-letter">{{ c.display_name|truncate_chars:1 }}</span>{% endif %}</span>
