{% load web_extras %}
<section class="hf-block hf-feed-block" aria-labelledby="hf-people-title">
  <div class="hf-title">
    <h2 class="hf-title-text" id="hf-people-title">People you may know</h2>
    <a class="hf-title-action" href="{% url 'web:leaderboard' %}">See All</a>
  </div>
  <div class="hf-rail-wrap">
    <div class="hf-rail hf-rail-peers hscroll">
      {% for person in people|slice:":8" %}
        {% include "web/_home_peer_card.html" with person=person %}
      {% endfor %}
    </div>
    <button type="button" class="hf-rail-btn hf-rail-prev" data-rail-prev aria-label="Scroll to earlier people"><span class="material-symbols-outlined">chevron_left</span></button>
    <button type="button" class="hf-rail-btn hf-rail-next" data-rail-next aria-label="Scroll to more people"><span class="material-symbols-outlined">chevron_right</span></button>
  </div>
</section>
