{% load static %}
<!DOCTYPE html>
<html lang="en" {% if dark_mode %}data-theme="dark"{% endif %}>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neby Code — local AI IDE — NEBians</title>
<meta name="description" content="Neby Code connects Neby models to your local workspace with file, terminal, and Git access.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'web/css/ai-widgets.css' %}?v=88">
<link rel="stylesheet" href="{% static 'web/css/lazy_harness.css' %}?v=88">
<link rel="stylesheet" href="{% static 'web/css/code_harness.css' %}?v=88">
<meta name="theme-color" content="#1b1c22">
</head>
<body data-authenticated="{{ is_authenticated|yesno:'true,false' }}">
{% csrf_token %}
<div id="codeRoot"></div>

<script nonce="{{ csp_nonce|default:request.csp_nonce }}">
window.CODE_BOOT = {
  sessions: {{ code_sessions_json|default:'[]'|safe }},
  initial_session_id: "{{ initial_session_id|default:''|escapejs }}",
  daemonOnline: {{ daemon_online|yesno:'true,false' }},
  daemonInfo: {{ daemon_info_json|default:'{}'|safe }},
  models: {{ code_models_json|default:'{}'|safe }},
  csrf: '{{ csrf_token }}',
  username: '{{ user_data.username|default:"nebian"|escapejs }}'
};
</script>
<script nonce="{{ csp_nonce|default:request.csp_nonce }}" src="{% static 'web/js/ai-widgets.js' %}?v=88"></script>
<script nonce="{{ csp_nonce|default:request.csp_nonce }}" src="{% static 'web/js/lazy/icons.js' %}?v=88"></script>
<script nonce="{{ csp_nonce|default:request.csp_nonce }}" src="{% static 'web/js/lazy/primitives.js' %}?v=88"></script>
<script nonce="{{ csp_nonce|default:request.csp_nonce }}" src="{% static 'web/js/code_api.js' %}?v=88"></script>
<script nonce="{{ csp_nonce|default:request.csp_nonce }}" src="{% static 'web/js/code/code_harness.js' %}?v=88"></script>
<script nonce="{{ csp_nonce|default:request.csp_nonce }}">
document.addEventListener("DOMContentLoaded", function() {
  var root = document.getElementById("codeRoot");
  if (root && window.CodeHarness) {
    window._codeHarness = new window.CodeHarness(root);
  }
});
</script>
</body>
</html>
