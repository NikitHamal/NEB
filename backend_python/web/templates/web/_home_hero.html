{% load static web_extras %}
<section class="home-landing" aria-labelledby="home-hero-title">
  <div class="home-landing-pattern" aria-hidden="true"></div>
  <div class="home-landing-hills" aria-hidden="true">
    <span class="home-hill home-hill-back"></span>
    <span class="home-hill home-hill-front"></span>
  </div>

  <div class="home-landing-inner">
    <div class="home-hero-copy">
      <h1 id="home-hero-title">
        Study <span class="home-title-chip home-title-chip-resource"><span class="material-symbols-outlined">menu_book</span>materials</span>.<br>
        Study <span class="home-title-chip home-title-chip-community"><span class="material-symbols-outlined">forum</span>mates</span>.
      </h1>
      <p class="home-hero-subtitle">Find notes, textbooks, and past papers, ask questions, share what you know, and study alongside learners and educators.</p>
      <div class="home-hero-actions">
        <a href="{% url 'web:library' %}" class="home-hero-button home-hero-button-primary">
          Explore resources
          <span class="material-symbols-outlined">arrow_forward</span>
        </a>
        <a href="{% url 'web:upload_resource' %}" class="home-hero-button home-hero-button-secondary">
          Upload resources
          <span class="material-symbols-outlined">upload</span>
        </a>
      </div>
    </div>
  </div>
</section>
