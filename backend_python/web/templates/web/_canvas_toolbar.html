<div class="canvas-top-tools" id="canvasTopTools" {% if readonly %}data-readonly="true"{% endif %}>
  <button class="cv-tool" id="cvCommandBtn" title="Search cards (Ctrl+K)" aria-label="Search cards"><span class="material-symbols-outlined">search</span></button>
  {% if not readonly %}
  <div id="cvToolGroups" class="cv-tool-groups tg-host tg-bare"></div>
  <span class="cv-tool-sep" aria-hidden="true"></span>
  <button class="cv-tool" id="cvNoteBtn" title="Add note" aria-label="Add note"><span class="material-symbols-outlined">note_add</span></button>
  <button class="cv-tool" id="cvHighlightsBtn" title="Highlights" aria-label="Highlights"><span class="material-symbols-outlined">bookmarks</span></button>
  <button class="cv-tool" id="cvHistoryBtn" title="Version history" aria-label="Version history"><span class="material-symbols-outlined">history</span></button>
  <button class="cv-tool" id="cvMoreBtn" title="More options" aria-label="More options"><span class="material-symbols-outlined">more_horiz</span></button>
  {% else %}
  <button class="cv-tool cv-tool-neby" id="cvCloneBtn" title="Copy this canvas" aria-label="Copy this canvas"><span class="material-symbols-outlined">content_copy</span></button>
  {% endif %}
</div>
<div class="cv-more-menu" id="cvMoreMenu" hidden>
  <button data-action="template"><span class="material-symbols-outlined">dashboard_customize</span> Templates</button>
  <button data-action="checkpoint"><span class="material-symbols-outlined">bookmark_add</span> Save checkpoint</button>
  <button data-action="export-json"><span class="material-symbols-outlined">data_object</span> Export JSON</button>
  <button data-action="export-md"><span class="material-symbols-outlined">markdown</span> Export Markdown</button>
  <button data-action="import"><span class="material-symbols-outlined">upload_file</span> Import canvas</button>
</div>
