{% comment %}The poll mark: three bars, drawn once here and used by every composer that offers a poll.
Stroke colour comes from currentColor, so it takes the button's own state. Size it with --poll-icon-size
on the parent when a surface needs something other than 19px.{% endcomment %}
<svg class="poll-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <line x1="18" y1="20" x2="18" y2="10"></line>
  <line x1="12" y1="20" x2="12" y2="4"></line>
  <line x1="6" y1="20" x2="6" y2="14"></line>
</svg>
