{% extends "base.html" %}

{% block title %}Server Error{% endblock %}



{% block content %}
<div class="error-container">
  <div class="error-code error-code-error">
    <span class="error-code-digit">5</span>0<span class="error-code-digit">0</span>
  </div>
  <h1 class="error-title">Server Error</h1>
  <p class="error-text">Something went wrong on our end. Please try again later or contact support if the issue persists.</p>
  <div class="error-actions">
    <a href="{% url 'web:home' %}" class="md-btn md-btn-filled error-btn">
      <span class="material-symbols-outlined">home</span>
      Go Home
    </a>
    <button onclick="history.back()" class="md-btn md-btn-outlined error-btn">
      <span class="material-symbols-outlined">arrow_back</span>
      Go Back
    </button>
  </div>
</div>
{% endblock %}
