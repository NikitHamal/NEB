{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="error-state" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <span class="material-symbols-outlined" style="font-size:80px;color:var(--md-error);">error_outline</span>
  <h1 class="md-headline-medium" style="margin-top:16px;">Server Error</h1>
  <p class="md-body-large" style="color:var(--md-on-surface-variant);margin-top:8px;">Something went wrong on our end. Please try again later.</p>
  <a href="{% url 'web:home' %}" class="md-btn md-btn-filled" style="margin-top:24px;">
    <span class="material-symbols-outlined" style="font-size:18px">home</span>
    Go Home
  </a>
</div>
{% endblock %}
