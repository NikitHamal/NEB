{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="error-state">
  <div class="error-bg-glow error-bg-glow-1"></div>
  <div class="error-bg-glow error-bg-glow-2"></div>
  
  <div class="error-state-card">
    <div class="error-state-icon-container">
      <span class="material-symbols-outlined">error</span>
    </div>
    <h1 class="error-state-title">Server Error</h1>
    <p class="error-state-desc">Something went wrong on our end. Please try again later.</p>
    <a href="{% url 'web:home' %}" class="error-state-btn">
      <span class="material-symbols-outlined">home</span>
      Go Home
    </a>
  </div>
</div>
{% endblock %}
