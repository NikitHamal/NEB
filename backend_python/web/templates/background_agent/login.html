{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <script nonce="{{ csp_nonce }}">
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Background Agent · NEBians</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'web/img/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap">
  <link rel="stylesheet" href="{% static 'web/css/material3.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/pages/background-agent.css' %}">
</head>
<body class="ba-login-body">
  <div class="ba-login-card">
    <div class="ba-login-brand">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="56" height="56" aria-label="NEBians">
        <defs>
          <linearGradient id="lFrontGrad" x1="40" y1="220" x2="800" y2="1350" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0058df"/><stop offset="0.48" stop-color="#004bd4"/><stop offset="1" stop-color="#003cc3"/></linearGradient>
          <linearGradient id="lDarkGrad" x1="505" y1="30" x2="960" y2="1290" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07337f"/><stop offset="0.55" stop-color="#052566"/><stop offset="1" stop-color="#021b54"/></linearGradient>
          <linearGradient id="lInnerGrad" x1="435" y1="180" x2="780" y2="890" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06327c"/><stop offset="1" stop-color="#04215e"/></linearGradient>
          <linearGradient id="lLightGrad" x1="305" y1="320" x2="615" y2="705" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8c5ff"/><stop offset="0.52" stop-color="#90b4fb"/><stop offset="1" stop-color="#82a8f5"/></linearGradient>
        </defs>
        <g transform="translate(210.601 86.137) scale(0.610119)">
          <g fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"><path d="M500 42 L501 135 L856 370 L858 1287 L943 1219 L943 331 Z"/><path d="M441 191 L441 282 L691 447 L691 799 L774 886 L775 408 Z"/><path d="M306 320 L307 377 L613 706 L613 485 Z"/><path d="M51 228 L51 1132 L263 1346 L267 812 L775 1353 L775 887 L691 800 L685 902 Z"/></g>
          <g stroke-linejoin="round" stroke-linecap="round"><path d="M500 42 L501 135 L856 370 L858 1287 L943 1219 L943 331 Z" fill="url(#lDarkGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M441 191 L441 282 L691 447 L691 799 L774 886 L775 408 Z" fill="url(#lInnerGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M306 320 L307 377 L613 706 L613 485 Z" fill="url(#lLightGrad)" stroke="#eef5ff" stroke-width="8"/><path d="M51 228 L51 1132 L263 1346 L267 812 L775 1353 L775 887 L691 800 L685 902 Z" fill="url(#lFrontGrad)" stroke="#eef5ff" stroke-width="8"/></g>
        </g>
      </svg>
    </div>
    <span class="ba-kicker">Background Agent</span>
    <h1 class="ba-login-title">Sign in</h1>
    <p class="ba-login-sub">Use your NEBians admin account. Username or email both work.</p>

    {% if error %}
    <div class="ba-login-error"><span class="material-symbols-outlined">error</span><span>{{ error }}</span></div>
    {% endif %}

    <form method="post" action="{% url 'web:background_agent_login' %}">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label class="ba-field">
        <span>Username or email</span>
        <input type="text" name="identifier" autocomplete="username" placeholder="e.g. nikit or you@example.com" required autofocus>
      </label>
      <label class="ba-field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
      </label>
      <button class="ba-btn ba-btn-primary ba-btn-large" type="submit">
        <span class="material-symbols-outlined">login</span>Sign in
      </button>
    </form>
    <p class="ba-login-foot">Only administrator accounts can access the Background Agent.</p>
  </div>
</body>
</html>
