# docker compose up --build   →  http://localhost:8000/api/content/manifest/
# Copy .env.example to .env first. With this file DB_* are set for you (MariaDB below).
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: nebians_db
      MARIADB_USER: nebians_user
      MARIADB_PASSWORD: ${DB_PASSWORD:-nebians-dev-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nebians-root-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [neb_db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  backend:
    build: .
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_NAME: nebians_db
      DB_USER: nebians_user
      DB_PASSWORD: ${DB_PASSWORD:-nebians-dev-password}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [neb_media:/app/public/media]
    restart: unless-stopped
volumes:
  neb_db:
  neb_media:
