<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBians M3X Art Library v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concepts/art-v5/v5-gallery.css">
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand"><div class="mark">N</div><div><h1>M3X Art Library v5</h1><div class="sub" id="subcount"></div></div></div><div class="grow"></div>
  <div class="seg" id="views"><button data-v="library" aria-pressed="true"><span class="ms">grid_view</span>Library</button><button data-v="inapp" aria-pressed="false"><span class="ms">devices</span>In-app</button><button data-v="studio" aria-pressed="false"><span class="ms">tune</span>Studio</button></div>
  <label class="find"><span class="ms">search</span><input id="q" type="search" placeholder="Search name or subject" autocomplete="off"></label>
  <button class="ib" id="shuf" aria-label="Shuffle"><span class="ms">shuffle</span></button><button class="ib" id="theme" aria-label="Light or dark"><span class="ms">dark_mode</span></button>
</div></header>
<main><section id="library"><div class="rail" id="kinds"></div><div class="rail" id="subs"></div><div class="grid" id="grid"></div><div class="more"><button class="btn t" id="more">Show more</button></div></section>
<section id="inapp" hidden></section><section id="studio" hidden></section></main>
<dialog id="dlg"></dialog>
<script src="concepts/art-v5/v5-core.js"></script><script src="concepts/art-v5/v5-face.js"></script><script src="concepts/art-v5/v5-hair.js"></script><script src="concepts/art-v5/v5-people.js"></script>
<script src="concepts/art-v5/v5-objects-a.js"></script><script src="concepts/art-v5/v5-objects-b.js"></script><script src="concepts/art-v5/v5-scenes.js"></script><script src="concepts/art-v5/v5-stage.js"></script>
<script src="concepts/art-v5/v5-data.js"></script><script src="concepts/art-v5/v5-catalog.js"></script>
<script src="concepts/art-v5/v5-gallery.js"></script><script src="concepts/art-v5/v5-inapp.js"></script><script src="concepts/art-v5/v5-studio.js"></script>
</body></html>
