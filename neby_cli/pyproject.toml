[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neby-cli"
version = "0.1.0"
description = "Minimal Autonomous Agentic Coding CLI using Proxy & Reversed Models"
readme = "README.md"
authors = [{ name = "NEBians Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "requests>=2.28.0",
]

[project.scripts]
neby = "neby_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neby_cli*"]
