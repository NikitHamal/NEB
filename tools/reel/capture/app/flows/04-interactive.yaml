appId: com.neb.ians
name: Interactive lessons and the native 3D labs
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn:
    text: "Library"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "Interactive"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: interactive-hub
- scrollUntilVisible:
    element:
      text: "(?i).*physics lab.*"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    text: "(?i).*physics lab.*"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: interactive-course
- tapOn:
    text: "(?i).*pendulum.*"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: interactive-pendulum
- startRecording: rec-pendulum
- swipe:
    start: "65%, 28%"
    end: "35%, 30%"
    duration: 1500
- waitForAnimationToEnd:
    timeout: 5000
- stopRecording
- back
- waitForAnimationToEnd:
    timeout: 3000
- back
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "(?i).*chemistry lab.*"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    text: "(?i).*chemistry lab.*"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "(?i).*molecule.*"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- startRecording: rec-molecule
- swipe:
    start: "70%, 30%"
    end: "30%, 34%"
    duration: 1800
- waitForAnimationToEnd:
    timeout: 4000
- stopRecording
- takeScreenshot: interactive-molecule
