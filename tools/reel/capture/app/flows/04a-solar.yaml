appId: com.neb.ians
name: 3D lab, Earth Moon and Sun
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn:
    text: "Library"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Interactive"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: interactive-hub
- scrollUntilVisible:
    element:
      text: "(?i)solar system journey"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "(?i)solar system journey"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: interactive-solar-course
- tapOn:
    text: "(?i).*earth.*moon.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: interactive-orbit
- startRecording: rec-orbit
- swipe:
    start: "70%, 30%"
    end: "35%, 34%"
    duration: 2200
- waitForAnimationToEnd:
    timeout: 5000
- stopRecording
