appId: com.neb.ians
name: A syllabus chapter in the native reader
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn:
    text: "Library"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Syllabus"
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      text: "Physics"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Physics"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: reader-subject
- tapOn: "START HERE"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: reader-top
- startRecording: rec-reader
- swipe:
    start: "50%, 82%"
    end: "50%, 34%"
    duration: 1800
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: reader-mid
- swipe:
    start: "50%, 82%"
    end: "50%, 34%"
    duration: 1800
- waitForAnimationToEnd:
    timeout: 2500
- swipe:
    start: "50%, 82%"
    end: "50%, 34%"
    duration: 1800
- waitForAnimationToEnd:
    timeout: 2500
- stopRecording
- takeScreenshot: reader-low
