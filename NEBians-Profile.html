<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBians Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p:#004bd4;--onp:#fff;--pc:#DCE1FF;--onpc:#00164E;--sc:#E0E1F9;--onsc:#191B2C;
  --tc:#FFD7F5;--ontc:#380038;--yc:#FFE08A;--onyc:#241A00;--gc:#C4EFCB;--ongc:#00210C;--rc:#FFDAD4;--onrc:#3B0907;
  --s:#FBF8FF;--s1:#F5F2FA;--s2:#EFEDF4;--s3:#E3E1E9;--on:#1B1B21;--onv:#45464F;--ol:#C6C6D0;--board:#F3F1EA;--card:#fff;
  --e:cubic-bezier(.2,0,0,1);--sp:cubic-bezier(.34,1.56,.64,1);
}
[data-theme=dark]{
  --p:#B6C4FF;--onp:#002780;--pc:#00389F;--onpc:#DCE1FF;--sc:#404659;--onsc:#DCE1F9;
  --tc:#5B3D57;--ontc:#FFD7F5;--yc:#584400;--onyc:#FFE08A;--gc:#0F5223;--ongc:#C4EFCB;--rc:#73342B;--onrc:#FFDAD4;
  --s:#121318;--s1:#1B1B21;--s2:#1F1F25;--s3:#2E2F36;--on:#E4E1E9;--onv:#C6C6D0;--ol:#45464F;--board:#08090C;--card:#1B1B21;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
html{font-family:Poppins,sans-serif;font-variant-numeric:tabular-nums}
body{background:var(--board);color:var(--on);padding:20px 16px 40px;transition:background .3s}
button,input,textarea,select{font:inherit;color:inherit;border:0;background:none}
button,[role=button]{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t-pc{--tb:var(--pc);--tf:var(--onpc)}.t-sc{--tb:var(--sc);--tf:var(--onsc)}.t-tc{--tb:var(--tc);--tf:var(--ontc)}
.t-yc{--tb:var(--yc);--tf:var(--onyc)}.t-gc{--tb:var(--gc);--tf:var(--ongc)}.t-rc{--tb:var(--rc);--tf:var(--onrc)}
/* board */
.board{display:flex;align-items:center;gap:10px;max-width:1280px;margin:0 auto 12px;flex-wrap:wrap}
.board h1{font-size:15px;font-weight:600;flex:1;min-width:140px;letter-spacing:-.01em}
.seg{display:flex;gap:2px;background:var(--s3);padding:4px;border-radius:23px;width:max-content;max-width:100%}
.seg button{height:38px;padding:0 18px;font-size:13px;font-weight:600;color:var(--onv);background:transparent;border-radius:19px;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--on);color:var(--s)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s2);flex:none;transition:border-radius .35s var(--sp),background .2s}
.ib:active{border-radius:14px}
/* frame */
.frame{container-type:inline-size;container-name:app;margin:0 auto;background:var(--s);overflow:hidden}
.frame[data-dev=phone]{width:min(400px,100%);height:860px;border-radius:48px;border:10px solid var(--on)}
.frame[data-dev=web]{width:min(1280px,100%);height:820px;border-radius:24px;border:1px solid var(--ol)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--s);color:var(--on);position:relative;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.bar b{flex:1;font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{overflow-y:auto;padding:0 16px 40px}
.pg{max-width:980px;margin:0 auto;animation:fade .35s var(--e)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.rs{animation:rise .5s var(--sp) backwards;animation-delay:calc(var(--n,0)*40ms)}
/* cover + identity */
.cover{height:132px;border-radius:28px;background:var(--pc);position:relative;overflow:hidden;color:var(--onpc)}
.cover svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.cover.t-gc{background:var(--gc)}.cover.t-yc{background:var(--yc)}.cover.t-tc{background:var(--tc)}
.who{display:flex;gap:14px;align-items:flex-end;margin:-38px 14px 0;position:relative}
.av{width:88px;height:88px;border-radius:50%;background:var(--sc);color:var(--onsc);display:grid;place-items:center;font-size:30px;font-weight:600;flex:none;overflow:hidden}
.av.sq{border-radius:28px;background:var(--pc);color:var(--onpc)}
.nm{font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;margin-top:10px}
.bd{color:var(--p);display:inline-grid}
.hl{font-size:14px;font-weight:500;color:var(--onv);margin-top:2px}
.ln{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;font-weight:500;color:var(--onv);margin-top:8px}
.ln span{display:inline-flex;align-items:center;gap:5px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* head grounded in the real profile: cover to both edges, back and utilities on the cover, avatar across its edge, one action opposite */
.sc.pf{padding-top:0}
.cover{height:150px;border-radius:0 0 28px 28px;margin:0 -16px}
.cb{position:absolute;top:14px;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--s) 72%,transparent);color:var(--on);z-index:2;transition:border-radius .3s var(--sp),transform .2s}
.cb:active{transform:scale(.94)}.cb.l{left:16px}.cb.r1{right:16px}.cb.r2{right:64px}
.who{justify-content:space-between;margin:-40px 0 0}
.av{border-radius:32%;width:92px;height:92px;box-shadow:none}
.av.sq{border-radius:30px}
.who .btn{height:40px;padding:0 18px}
.stl{display:flex;gap:18px;margin-top:12px;font-size:13px;font-weight:500;color:var(--onv)}
.stl b{font-weight:600;color:var(--on);margin-right:4px}

.btn{height:44px;padding:0 20px;border-radius:22px;background:var(--p);color:var(--onp);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:border-radius .35s var(--sp),transform .2s var(--sp)}
.btn:active{transform:scale(.96)}
.btn.t{background:var(--pc);color:var(--onpc)}.btn.o{background:var(--s2);color:var(--on)}
.btn.sm{height:36px;padding:0 14px;font-size:12.5px;border-radius:18px}
.btn[disabled]{opacity:.4;pointer-events:none}
/* cards */
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--ol) 55%,transparent);border-radius:24px;padding:16px;margin-top:12px}
.card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .i{color:var(--p)}.card h3 em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--p)}
.txt{font-size:13.5px;line-height:1.6;color:var(--onv);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 13px;border-radius:16px;background:var(--tb,var(--sc));color:var(--tf,var(--onsc));font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .2s,transform .3s var(--sp)}
button.chip:active{transform:scale(.94)}
.chip.on{background:var(--p);color:var(--onp)}
.chip.pop{animation:pop .4s var(--sp)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--s1);border-radius:20px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat small{font-size:12px;font-weight:500;color:var(--onv)}
.fac{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:18px;padding:11px 12px;font-size:12.5px;font-weight:600}
.fac .i{color:var(--p)}
.bar2{height:12px;border-radius:6px;background:var(--s3);position:relative;overflow:hidden}
.bar2 i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--p);transition:width .8s var(--e)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--s3)}
.tl>div{position:relative;padding-bottom:14px}
.tl>div:before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--s3);border:3px solid var(--card)}
.tl>div.cur:before{background:var(--p)}
.tl b{font-size:13.5px;font-weight:600;display:block}.tl small{font-size:12px;color:var(--onv);font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--s1);margin-top:8px;text-align:left;width:100%;transition:transform .3s var(--sp),border-radius .3s var(--sp)}
.row:active{transform:scale(.98)}
.tile{width:44px;height:44px;border-radius:14px;background:var(--tb,var(--pc));color:var(--tf,var(--onpc));display:grid;place-items:center;flex:none}
.row .m{flex:1;min-width:0}.row .m b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{font-size:12px;font-weight:500;color:var(--onv)}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--tb,var(--sc));color:var(--tf,var(--onsc));white-space:nowrap}
.add{border:1.5px dashed var(--ol);border-radius:20px;padding:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--onv);width:100%;margin-top:8px;transition:background .2s}
.add:hover{background:var(--s1)}
@container app (min-width:820px){
  .pg.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 20px;align-items:start}
  .pg.two>.side{grid-column:2;grid-row:1/span 2}
  .cover{height:180px}
}
</style>
<style>
/* strength ring + steps */
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--s3)}.ring .pr{stroke:var(--p);transition:stroke-dashoffset .9s var(--e)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:600;letter-spacing:-.02em}
.str{display:flex;gap:16px;align-items:center}
.str h3{margin:0 0 4px}.str p{font-size:12.5px;color:var(--onv);font-weight:500;line-height:1.5}
.nx{display:flex;gap:6px;overflow-x:auto;margin-top:14px}
.nx .chip{height:36px;flex:none}
/* sheet */
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--on) 38%,transparent);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--s);border-radius:32px 32px 0 0;z-index:21;transform:translateY(105%);transition:transform .5s var(--sp);display:flex;flex-direction:column}
.sheet.on{transform:none}
@container app (min-width:820px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px;bottom:20px;border-radius:32px}}
.sh-h{display:flex;align-items:center;gap:10px;padding:18px 20px 8px}
.sh-h b{flex:1;font-size:18px;font-weight:600;letter-spacing:-.02em}
.sh-b{overflow-y:auto;padding:4px 20px 12px}
.sh-f{padding:10px 20px 20px;display:flex;gap:8px}.sh-f .btn{flex:1;justify-content:center}
/* fields */
.fl{margin-top:14px}.fl label{display:block;font-size:12px;font-weight:600;color:var(--onv);margin:0 0 6px 4px}
.fl label u{text-decoration:none;color:var(--p);margin-left:6px}
.in{width:100%;min-height:50px;border-radius:16px;background:var(--card);border:1.5px solid var(--ol);padding:0 16px;font-size:15px;font-weight:500;outline:0;transition:border-color .2s}
.in:focus{border-color:var(--p)}
textarea.in{padding:13px 16px;min-height:104px;resize:none;line-height:1.5}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:18px;padding:12px 14px;width:100%;font-size:14px;font-weight:600;text-align:left}
.sw i{margin-left:auto;width:46px;height:28px;border-radius:14px;background:var(--s3);position:relative;transition:background .25s}
.sw i:after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .35s var(--sp)}
.sw.on i{background:var(--p)}.sw.on i:after{transform:translateX(18px)}
.hint{font-size:12px;color:var(--onv);font-weight:500;margin:6px 4px 0;line-height:1.5}
/* stepper, search results */
.stp{display:flex;gap:5px;margin:4px 0 18px}.stp i{flex:1;height:6px;border-radius:3px;background:var(--s3);transition:background .3s}.stp i.on{background:var(--p)}
.h1{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:6px 0 6px}
.sub{font-size:13.5px;color:var(--onv);font-weight:500;line-height:1.5}
.role{display:flex;gap:14px;align-items:center;padding:16px;border-radius:24px;background:var(--s1);margin-top:10px;width:100%;text-align:left;border:2px solid transparent;transition:border-color .2s,background .2s,transform .3s var(--sp)}
.role.on{border-color:var(--p);background:var(--pc);color:var(--onpc)}
.role:active{transform:scale(.98)}
.role b{font-size:15px;font-weight:600;display:block}.role small{font-size:12.5px;font-weight:500;opacity:.8}
.srch{display:flex;align-items:center;gap:10px;height:50px;border-radius:25px;background:var(--s2);padding:0 18px}
.srch input{flex:1;min-width:0;outline:0;font-size:15px;font-weight:500}
.mini{width:56px}.mini .bar2{height:6px}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:20px;padding:14px;background:var(--tb);color:var(--tf);font-size:13px;font-weight:500;line-height:1.5;margin-top:12px}
.note b{font-weight:600}
.stage{display:flex;gap:12px;align-items:center;padding:10px 0}
.stage .d{width:32px;height:32px;border-radius:50%;background:var(--s3);display:grid;place-items:center;flex:none;transition:background .4s,color .4s}
.stage.ok .d{background:var(--p);color:var(--onp)}.stage b{font-size:13.5px;font-weight:600;display:block}.stage small{font-size:12px;color:var(--onv)}
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--on);color:var(--s);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .45s var(--sp);z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:6px;margin:16px 0 0;overflow-x:auto}
.tabs button{height:38px;padding:0 16px;border-radius:19px;background:var(--s2);font-size:13px;font-weight:600;flex:none;transition:background .2s,transform .3s var(--sp)}
.tabs button.on{background:var(--on);color:var(--s)}
</style>
</head>

<script>

function score(p){const tot=fieldsOf(p).reduce((a,x)=>a+x.f[3],0);const got=fieldsOf(p).reduce((a,x)=>a+(filled(V[p][x.f[0]])?x.f[3]:0),0);return Math.round(got/tot*100)}

<script>
/* ---------- profile screen ---------- */
const rs=(h,n)=>`<div class="rs" style="--n:${n}">${h}</div>`;
const chips=(arr,opts,tone='sc')=>`<div class="chips">${arr.map(k=>`<span class="chip t-${tone}">${esc(opts?lab(opts,k):k)}</span>`).join('')}</div>`;
const card=(ico,t,body,act)=>`<div class="card"><h3>${ic(ico,20)}${t}${act||''}</h3>${body}</div>`;
const own=()=>S.view==='owner';
const editBtn=(id,txt='Edit')=>own()?`<em><button data-edit="${id}" style="color:var(--p);font-weight:600;font-size:12px">${txt}</button></em>`:'';
const ph=(id,txt,ico)=>own()?`<button class="add" data-edit="${id}">${ic('plus',20)}${txt}</button>`:'';
function ringHtml(p){const v=score(p),C=2*Math.PI*35;return`<div class="ring"><svg viewBox="0 0 84 84"><circle class="tr" cx="42" cy="42" r="35"/><circle class="pr" cx="42" cy="42" r="35" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v/100)}"/></svg><b>${v}%</b></div>`}
function strength(p){
  const g=gaps(p).slice(0,4),v=score(p);
  const msg=v>=90?'Complete. Students and parents get the full picture.':p==='institution'?'The fuller your page, the higher you appear in Find a college.':'Add what you like, whenever you like. Nothing is forced.';
  return `<div class="card"><div class="str">${ringHtml(p)}<div><h3>Portfolio strength</h3><p>${msg}</p></div></div>${g.length?`<div class="nx">${g.map(x=>`<button class="chip t-pc" data-edit="${x.s.id}">${ic(x.s.ic,16)}${x.s.t}</button>`).join('')}</div>`:''}</div>`}
function head(p){
  const w=WHO[p],v=V[p],bd=w.badge?`<span class="bd" title="Verified">${ic('verified',22)}</span>`:'';
  const sub=p==='teacher'?(v.headline||''):p==='institution'?(v.motto||''):(v.headline||'');
  const lines=w.line.map((l,i)=>`<span>${ic(i?'pin':'school',15)}${esc(l)}</span>`).join('');
  const act=own()?`<button class="btn o" data-edit="all">${ic('edit',18)}Edit profile</button>`:`<button class="btn" data-fol>${ic('plus',18)}Follow</button>`;
  const deco=`<svg viewBox="0 0 400 130" preserveAspectRatio="xMidYMid slice"><circle cx="340" cy="30" r="70" fill="currentColor" opacity=".16"/><circle cx="60" cy="140" r="90" fill="currentColor" opacity=".12"/><rect x="170" y="-30" width="90" height="90" rx="32" fill="currentColor" opacity=".1" transform="rotate(20 215 15)"/></svg>`;
  const util=`<button class="cb r2" data-copy aria-label="Copy profile link">${ic('link',20)}</button><button class="cb r1" ${own()?'data-edit="all" aria-label="Edit profile details"':'data-more aria-label="More options"'}>${ic(own()?'settings':'more',20)}</button>`;
  const stl=w.stats.map(x=>`<span><b>${x[1].toLocaleString()}</b>${x[0]}</span>`).join('');
  return `<div class="cover t-${w.cover}" style="color:var(--tf)">${deco}<button class="cb l" data-back aria-label="Go back">${ic('back',22)}</button>${util}</div><div class="who"><div class="av ${w.sq?'sq':''}">${esc(w.init)}</div>${act}</div>
  <div class="nm">${esc(w.name)}${bd}</div><div class="hl" style="margin-top:0">@${esc(w.user)}</div>${sub?`<div class="hl">${esc(sub)}</div>`:''}<div class="ln">${lines}</div><div class="stl">${stl}</div>`}
const facts=v=>[['Established',v.est],['Students',v.students&&v.students.toLocaleString()],['Teachers',v.teachers],['Staff',v.staff]].filter(x=>x[1]);
function instBody(p,v,w){
  let o=[],n=0;
  const f=facts(v);
  o.push(rs(f.length?`<div class="grid" style="margin-top:12px">${f.map(x=>`<div class="stat"><b>${esc(x[1])}</b><small>${x[0]}</small></div>`).join('')}</div>`:ph('people','Add established year and numbers'),n++));
  if(v.admissionOpen)o.push(rs(`<div class="note t-gc">${ic('cal',22)}<div><b>Admissions are open</b><br>${esc(v.admissionNote||'Call the office to book a visit.')}</div></div>`,n++));
  o.push(rs(v.about?card('doc','About',`<p class="txt">${esc(v.about)}</p>`,editBtn('about')):ph('about','Write about your institution'),n++));
  o.push(rs(v.levels&&v.levels.length?card('school','Levels offered',chips(v.levels,OPT.levels,'pc'),editBtn('levels')):ph('levels','Add the levels you offer'),n++));
  if(v.feeMin){const mx=v.feeMax||v.feeMin,pct=Math.min(100,Math.round(mx/300000*100));o.push(rs(card('coin','Yearly fees',`<div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:26px;font-weight:600;letter-spacing:-.02em">Rs ${v.feeMin.toLocaleString()}</b>${v.feeMax?`<span class="txt">to Rs ${v.feeMax.toLocaleString()}</span>`:''}</div><div class="bar2" style="margin-top:12px"><i style="width:${pct}%"></i></div><p class="hint">Compared with Rs 3,00,000 a year, the top of private schools in Nepal.</p>`,editBtn('fees')),n++))}else o.push(rs(ph('fees','Add your fees'),n++));
  o.push(rs(v.facilities&&v.facilities.length?card('lib','Facilities',`<div class="grid">${v.facilities.map(k=>{const x=OPT.fac.find(y=>y[0]===k);return`<div class="fac">${ic(x[2],20)}${x[1]}</div>`}).join('')}</div>`,editBtn('fac')):ph('fac','Add your facilities'),n++));
  if(v.principal)o.push(rs(card('users','Leadership',`<div class="row" style="margin:0"><div class="tile t-tc">${ic('users',22)}</div><div class="m"><b>${esc(v.principal)}</b><small>Principal</small></div></div>`,editBtn('basics')),n++));
  o.push(rs(v.branches&&v.branches.length?card('branch','Branches',v.branches.map(b=>`<div class="row"><div class="tile t-sc">${ic('pin',22)}</div><div class="m"><b>${esc(b.n)}</b><small>${esc(b.p)}</small></div></div>`).join(''),editBtn('contact')):ph('contact','Add a branch'),n++));
  const call=v.phone?`<div class="acts" style="margin-top:0"><button class="btn t sm">${ic('phone',16)}${esc(v.phone)}</button><button class="btn o sm">${ic('globe',16)}Website</button><button class="btn o sm">${ic('pin',16)}Directions</button></div>`:'';
  o.push(rs(v.phone||v.address?card('phone','Contact',`${v.address?`<p class="txt" style="margin-bottom:12px">${esc(v.address)}</p>`:''}${call}`,editBtn('contact')):ph('contact','Add phone and address'),n++));
  return o.join('')}
function teacherBody(p,v){
  let o=[],n=0;
  o.push(rs(`<div class="grid" style="margin-top:12px"><div class="stat"><b>${v.years||0}</b><small>Years teaching</small></div><div class="stat"><b>${1+(v.past||[]).length}</b><small>Schools</small></div></div>`,n++));
  o.push(rs(v.subjects&&v.subjects.length?card('book','Teaches',`<div class="chips" style="margin-bottom:10px">${v.subjects.map(s=>`<span class="chip t-pc">${esc(s)}</span>`).join('')}</div>${chips(v.tlevels||[],OPT.levels,'sc')}`,editBtn('teach')):ph('teach','Add subjects and levels'),n++));
  const cur=v.school?`<div class="cur"><b>${esc(v.school)}</b><small>${esc(lab(OPT.emp,v.employment||''))||'Current school'} · Present</small></div>`:'';
  const past=(v.past||[]).map(x=>`<div><b>${esc(x.n)}</b><small>${esc(x.p)}</small></div>`).join('');
  o.push(rs(cur||past?card('school','Schools',`<div class="tl">${cur}${past}</div>`,editBtn('school')):ph('school','Add your school'),n++));
  if(!(v.past||[]).length)o.push(rs(ph('past','Add a past school'),n++));
  o.push(rs(v.qual?card('trophy','Qualification',`<p class="txt">${esc(v.qual)}</p>`,editBtn('exp')):ph('exp','Add your qualification'),n++));
  o.push(rs(v.about?card('doc','About',`<p class="txt">${esc(v.about)}</p>`,editBtn('me')):ph('me','Write about you'),n++));
  return o.join('')}
function personBody(p,v){
  let o=[],n=0;
  o.push(rs(v.level?card('school','Studying',`<div class="row" style="margin:0"><div class="tile t-pc">${ic('school',22)}</div><div class="m"><b>${esc(v.level)}</b><small>${esc(v.school||'Add your school')}</small></div></div>`,editBtn('now')):ph('now','Where do you study?'),n++));
  o.push(rs(v.about?card('doc','About',`<p class="txt">${esc(v.about)}</p>`,editBtn('me')):ph('me','Write a short about'),n++));
  o.push(rs(v.skills&&v.skills.length?card('star','Skills',chips(v.skills,0,'pc'),editBtn('skills')):ph('skills','Add skills'),n++));
  if(p==='student'){const a=v.achievements||[];o.push(rs(a.length?card('trophy','Achievements',`<div class="tl">${a.map(x=>`<div><b>${esc(x.n)}</b><small>${esc(x.p)}</small></div>`).join('')}</div>`,editBtn('port')):ph('port','Add an achievement or project'),n++))}
  return o.join('')}
function profile(){
  const p=S.per,w=WHO[p],v=V[p],st=w.stats.map(x=>`<div class="stat" style="padding:12px"><b style="font-size:22px">${x[1].toLocaleString()}</b><small>${x[0]}</small></div>`).join('');
  const side=`${own()?strength(p):''}`;
  const body=p==='institution'?instBody(p,v,w):p==='teacher'?teacherBody(p,v):personBody(p,v);
  return `<div class="pg two"><div class="hd">${head(p)}</div><div class="side">${side}</div><div>${body}</div></div>`}
</script>
<script>

    ${r==='student'?`<div class="fl"><label>Class or program<u>Required</u></label><div class="chips">${['Class 9','Class 10','Class 11','Class 12','Bachelors'].map(s=>`<button class="chip">${s}</button>`).join('')}</div></div>`:''}`}
    <div class="note t-gc" style="margin-top:18px">${ic('check',22)}<div><b>Everything else is optional.</b><br>${inst?'After you are verified, fill in fees, facilities, levels and more whenever you like.':'Add experience, skills and more from your profile at any time.'}</div></div>`;
  return `<div class="pg" style="padding-top:8px">${bars}${h}<div class="acts" style="margin-top:22px">${st>0?'<button class="btn o" data-sb>Back</button>':''}<button class="btn" data-sn>${st===2?'Finish':'Continue'}</button></div></div>`}
function wireSignup(){
  const i=$('#sgs');if(!i)return;
  const draw=()=>{const q=i.value.toLowerCase();const rows=NEWSCHOOLS.filter(x=>x[0].toLowerCase().includes(q)).slice(0,4);
    $('#sgr').innerHTML=rows.map(x=>`<button class="row"><div class="tile t-sc">${ic('school',22)}</div><div class="m"><b>${x[0]}</b><small>${x[1]} · ${x[2]}</small></div>${x[4]?'<span class="tag t-gc">On NEBians</span>':''}</button>`).join('')};
  i.oninput=draw;draw()}
</script>
<script>
/* ---------- claim: find, prove, wait, then fill in ---------- */
function claim(){
  const c=S.cl,s=S.sel||NEWSCHOOLS[4];
  const stages=[['Application sent','Name, registration number and a document'],['Documents checked','We call the contact person if needed'],['Verified','Your page goes live and ranks higher']];
  if(c===0)return`<div class="pg" style="padding-top:8px"><div class="h1">Claim your institution</div><p class="sub">Verified institutions appear first in Find a college and get a full portfolio page.</p>
   <div class="fl"><div class="srch">${ic('search',20)}<input id="cs" placeholder="Search 24,665 institutions"></div></div><div id="cr"></div></div>`;
  if(c===1)return`<div class="pg" style="padding-top:8px"><div class="stp"><i class="on"></i><i class="on"></i><i></i></div><div class="row" style="margin:0 0 6px"><div class="tile t-pc">${ic('school',22)}</div><div class="m"><b>${esc(s[0])}</b><small>${s[1]} · ${s[2]}</small></div></div>
   <div class="fl"><label>Registration number<u>Required</u></label><input class="in" id="rg" placeholder="e.g. 123456/078"></div>
   <div class="two2"><div class="fl"><label>Contact person<u>Required</u></label><input class="in" placeholder="Full name"></div><div class="fl"><label>Role<u>Required</u></label><input class="in" placeholder="Principal"></div></div>
   <div class="two2"><div class="fl"><label>Phone<u>Required</u></label><input class="in" inputmode="tel"></div><div class="fl"><label>Email<u>Required</u></label><input class="in" type="email"></div></div>
   <div class="fl"><label>Documents<u>Required</u></label><button class="add" data-doc style="margin-top:0">${ic('doc',20)}<span id="dn">Attach registration certificate or authority letter</span></button><p class="hint">PDF, JPG, PNG or WebP, up to 8 MB each. Kept private and only seen by our reviewers.</p></div>
   <div class="acts"><button class="btn o" data-cb>Back</button><button class="btn" data-cn>Send application</button></div></div>`;
  return`<div class="pg" style="padding-top:8px"><div class="h1">${c===2?'Under review':'You are verified'}</div><p class="sub">${c===2?'Most applications are checked within two working days.':'Your page is live. Fill in the rest whenever you like.'}</p>
   <div class="card">${stages.map((x,i)=>`<div class="stage ${(c===3||i===0)?'ok':''}"><div class="d">${ic('check',18)}</div><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`).join('')}</div>
   ${c===2?`<div class="acts"><button class="btn t" data-cn>Preview: mark as verified</button></div>`:`<div class="card"><div class="str">${ringHtml('institution')}<div><h3>Your portfolio</h3><p>${score('institution')}% filled. Add fees, levels and facilities to rise in Find a college.</p></div></div><div class="acts"><button class="btn" data-go="profile">Open my page</button></div></div>`}</div>`}
function wireClaim(){
  const i=$('#cs');if(!i)return;
  const draw=()=>{const q=i.value.toLowerCase();$('#cr').innerHTML=NEWSCHOOLS.filter(x=>x[0].toLowerCase().includes(q)).slice(0,6).map((x,n)=>`<button class="row rs" style="--n:${n}" data-pick="${NEWSCHOOLS.indexOf(x)}"><div class="tile ${x[4]?'t-gc':'t-sc'}">${ic('school',22)}</div><div class="m"><b>${x[0]}</b><small>${x[1]} · ${x[2]}</small></div>${x[4]?'<span class="tag t-gc">Claimed</span>':`<span class="tag t-pc">Claim</span>`}</button>`).join('')};
  i.oninput=draw;draw()}
/* ---------- Find a college: the filled pages come first ---------- */
function find(){
  const rows=[...NEWSCHOOLS].filter(x=>x[1]==='College'||S.fk==='all').sort((a,b)=>b[3]-a[3]);
  return`<div class="pg" style="padding-top:8px"><div class="h1">Find a college</div><div class="seg" style="margin:10px 0 4px"><button class="${S.fk!=='all'?'on':''}" data-fk="col">Colleges</button><button class="${S.fk==='all'?'on':''}" data-fk="all">All institutions</button></div>
  <p class="hint">Complete profiles are listed first. Tap a row to see fees, levels and how to reach them.</p>
  ${rows.map((x,n)=>`<button class="row rs" style="--n:${n}" data-open="${NEWSCHOOLS.indexOf(x)}"><div class="tile ${x[4]?'t-gc':'t-sc'}">${ic(x[1]==='College'?'hall':'school',22)}</div><div class="m"><b>${x[0]}</b><small>${x[2]} · ${x[4]?(x[3]>70?'Rs 96k to 1.8L a year':'Fees listed'):'Profile not filled'}</small>${x[4]?`<div class="bar2 mini" style="width:120px;margin-top:6px"><i style="width:${x[3]}%"></i></div>`:''}</div>${x[4]?`<span class="tag t-gc">${x[3]}%</span>`:'<span class="tag t-sc">Invite</span>'}</button>`).join('')}</div>`}
/* ---------- shell ---------- */
const SCR=[['profile','Profile'],['signup','Sign up'],['claim','Claim'],['find','Find college']];
const PER=[['student','Student'],['teacher','Teacher'],['institution','Institution'],['explorer','Explorer']];
function seg(id,list,key){$(id).innerHTML=list.map(x=>`<button data-k="${x[0]}" class="${S[key]===x[0]?'on':''}">${x[1]}</button>`).join('')}
function chrome(){seg('#sPer',PER,'per');seg('#sScr',SCR,'scr');seg('#sView',[['owner','Owner'],['visitor','Visitor']],'view');
  document.querySelectorAll('#sDev button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.dev));
  $('#frame').dataset.dev=S.dev;$('#bTheme').innerHTML=ic(document.documentElement.dataset.theme==='dark'?'sun':'moon',20)}
function render(){
  chrome();
  const t={profile:WHO[S.per].user,signup:'Create account',claim:'Claim institution',find:'Pathways'}[S.scr];
  const body={profile,signup,claim,find}[S.scr]();
  $('#app').innerHTML=`${S.scr==='profile'?'<div></div>':`<div class="bar"><b>${esc(t)}</b></div>`}<div class="sc ${S.scr==='profile'?'pf':''}" id="sc">${body}</div><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>`;
  if(S.scr==='signup')wireSignup();if(S.scr==='claim')wireClaim()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]');if(!t)return;const d=t.dataset;
  if(t.closest('#sPer')){S.per=d.k;S.scr='profile';return render()}
  if(t.closest('#sScr')){S.scr=d.k;S.step=0;S.cl=0;return render()}
  if(t.closest('#sView')){S.view=d.k;S.scr='profile';return render()}
  if(t.closest('#sDev')){S.dev=d.v;return render()}
  if(t.id==='bTheme'){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';return chrome()}
  if('back' in d){if(S.from){S.scr=S.from;S.from='';S.view='owner';return render()}return toast('Back to the feed')}
  if('copy' in d)return toast('Profile link copied');
  if('more' in d)return toast('More options');
  if('fol' in d){t.classList.toggle('t');t.lastChild.textContent=t.classList.contains('t')?'Following':'Follow';return}
  if(d.edit)return openSheet(d.edit);
  if('close' in d)return closeSheet();
  if(d.ch){const a=DRAFT,k=d.ch;if(d.one==='1')a[k]=a[k]===d.v?'':d.v;else{a[k]=a[k]||[];const i=a[k].indexOf(d.v);i<0?a[k].push(d.v):a[k].splice(i,1)}t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',d.one==='1'?a[k]===c.dataset.v:a[k].includes(c.dataset.v)));return}
  if(d.tg){DRAFT[d.tg]=!DRAFT[d.tg];return t.classList.toggle('on',DRAFT[d.tg])}
  if(d.ad){const n=$('#ln-'+d.ad).value.trim();if(!n)return;(DRAFT[d.ad]=DRAFT[d.ad]||[]).push({n,p:$('#lp-'+d.ad).value.trim()});const sc=$('.sh-b').scrollTop;openSheet(SHEET);$('.sh-b').scrollTop=sc;return}
  if(d.rm){DRAFT[d.rm].splice(+d.i,1);const sc=$('.sh-b').scrollTop;openSheet(SHEET);$('.sh-b').scrollTop=sc;return}
  if('save' in d){document.querySelectorAll('#sheet [data-k]').forEach(el=>{const k=el.dataset.k,f=fieldsOf(S.per).find(x=>x.f[0]===k).f;DRAFT[k]=(f[2]==='num'||f[2]==='year')&&el.value.trim()?+el.value.replace(/\D/g,''):el.value.trim()});V[S.per]=DRAFT;closeSheet();render();toast('Saved. Strength is '+score(S.per)+'%');return}
  if('sn' in d){if(S.step<2){S.step++;return render()}S.scr='profile';S.per=S.role;S.view='owner';render();return toast('Welcome. Fill the rest whenever you like.')}
  if('sb' in d){S.step--;return render()}
  if(d.role){S.role=d.role;return render()}
  if(d.pick){S.sel=NEWSCHOOLS[+d.pick];if(S.sel[4])return toast('Already claimed. Ask the owner to add you.');S.cl=1;return render()}
  if('cn' in d){S.cl=Math.min(3,S.cl+1);render();return}
  if('cb' in d){S.cl=0;return render()}
  if('doc' in d){$('#dn').textContent='registration-certificate.pdf attached';return t.classList.add('pop')}
  if(d.go){S.scr=d.go;S.per='institution';return render()}
  if(d.fk){S.fk=d.fk;return render()}
  if(d.open){S.from=S.scr;S.per='institution';S.view='visitor';S.scr='profile';return render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
</script>
</body>
</html>
