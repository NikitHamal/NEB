[package]
name = "nebians-desktop"
version = "0.1.0"
edition = "2021"
description = "NEBians — native desktop app (Rust / egui) for Nepal's open-learning platform"
license = "UNLICENSED"
publish = false
build = "build.rs"

[[bin]]
name = "nebians"
path = "src/main.rs"

[dependencies]
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.29", features = ["image", "svg", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
scraper = "0.20"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
