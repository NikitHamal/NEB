<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBians M3X Art Library v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concepts/art-v3/v3-gallery.css">
<link rel="stylesheet" href="concepts/art-v4/v4-gallery.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><div class="mark">N</div><div><h1>M3X Art Library v4</h1><div class="sub" id="subcount"></div></div></div>
    <div class="grow"></div>
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-v="library" aria-pressed="true"><span class="ms">grid_view</span>Library</button>
      <button data-v="inapp" aria-pressed="false"><span class="ms">devices</span>In-app</button>
      <button data-v="studio" aria-pressed="false"><span class="ms">tune</span>Studio</button>
    </div>
    <label class="find"><span class="ms">search</span><input id="q" type="search" placeholder="Search subject, scene, palette" autocomplete="off"></label>
    <button class="ib" id="shuf" aria-label="Shuffle" title="Shuffle"><span class="ms">shuffle</span></button>
    <button class="ib" id="mode" aria-label="Theme" title="Light or dark"><span class="ms">dark_mode</span></button>
    <a class="ib" href="art-v3.html" aria-label="Art v3" title="Art library v3"><span class="ms">history</span></a>
  </div>
  <nav class="rail" id="rail" aria-label="Art kinds"></nav>
</header>
<main><div id="stage"></div></main>
<div class="dlg" id="dlg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="sheet-art" id="dart"></div>
    <div class="sheet-bar">
      <div><b id="dtitle" style="display:block"></b><small id="dmeta" class="sub"></small></div>
      <span class="grow"></span>
      <button class="btn" id="dcopy"><span class="ms">content_copy</span>Copy SVG</button>
      <button class="btn" id="dpng"><span class="ms">image</span>2x PNG</button>
      <button class="btn f" id="ddl"><span class="ms">download</span>SVG</button>
      <button class="ib" id="dx" aria-label="Close"><span class="ms">close</span></button>
    </div>
  </div>
</div>
<script src="concepts/art/glyphs.js"></script>
<script src="concepts/art-v3/v3-core.js"></script>
<script src="concepts/art-v4/v4-core.js"></script>
<script src="concepts/art-v4/v4-scenes-a.js"></script>
<script src="concepts/art-v4/v4-scenes-b.js"></script>
<script src="concepts/art-v4/v4-scenes-c.js"></script>
<script src="concepts/art-v4/v4-objects-a.js"></script>
<script src="concepts/art-v4/v4-objects-b.js"></script>
<script src="concepts/art-v4/v4-stage.js"></script>
<script src="concepts/art-v4/v4-people.js"></script>
<script src="concepts/art-v4/v4-critters.js"></script>
<script src="concepts/art-v4/v4-catalog.js"></script>
<script src="concepts/art-v4/v4-previews.js"></script>
<script src="concepts/art-v4/v4-gallery.js"></script>
</body>
</html>
