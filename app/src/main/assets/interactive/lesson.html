<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --md-surface-container-lowest: #ffffff;
  --md-surface-container-low: #f7f7f8;
  --md-surface-container: #efeef0;
  --md-on-surface: #1b1c1f;
  --md-on-surface-variant: #44474f;
  --md-outline-variant: #c4c6cf;
  --md-primary: #004ac6;
  --md-primary-container: #dae2ff;
  --md-on-primary: #ffffff;
  --md-radius-lg: 12px;
  --md-radius-md: 8px;
  --ix-color: #004ac6;
  color-scheme: light dark;
}
html.dark {
  --md-surface-container-lowest: #111115;
  --md-surface-container-low: #1d1d22;
  --md-surface-container: #26262c;
  --md-on-surface: #e4e2e6;
  --md-on-surface-variant: #c4c6cf;
  --md-outline-variant: #44474f;
  --md-primary: #aec6ff;
  --md-primary-container: #004ac6;
  --md-on-primary: #003090;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--md-surface-container-lowest);
  color: var(--md-on-surface);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Sim container — fills viewport width, proper aspect ratio */
.ix-sim-shell {
  background: var(--md-surface-container-lowest);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--md-radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  margin: 0;
}
.ix-sim-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: linear-gradient(160deg, #0c1626, #16233a);
  overflow: hidden;
}
.ix-sim-canvas { display: block; width: 100%; height: 100%; }
.ix-sim-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; color: #c7d4ea; font-size: 0.875rem; text-align: center;
  padding: 20px; z-index: 2;
}
.ix-spinner {
  width: 38px; height: 38px;
  border: 3px solid rgba(199,212,234,0.25);
  border-top-color: #c7d4ea;
  border-radius: 50%;
  animation: ix-spin 0.9s linear infinite;
}
@keyframes ix-spin { to { transform: rotate(360deg); } }
.ix-sim-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 8px 12px;
  border-top: 1px solid var(--md-outline-variant);
  background: var(--md-surface-container-low);
}
.ix-sim-hint {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.75rem; color: var(--md-on-surface-variant);
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ix-sim-hint .material-symbols-outlined { font-size: 16px; flex-shrink: 0; }
.ix-fullscreen-btn { flex-shrink: 0; }

/* Fullscreen */
.ix-fake-fullscreen { position: fixed !important; inset: 0; z-index: 1000; border-radius: 0; border: none; }
.ix-fake-fullscreen .ix-sim-stage { aspect-ratio: auto; max-height: none; flex: 1; }
.ix-sim-shell:fullscreen { border-radius: 0; border: none; }
.ix-sim-shell:fullscreen .ix-sim-stage { aspect-ratio: auto; max-height: none; flex: 1; }
.ix-no-scroll { overflow: hidden; }

/* Control panels (for sims that create them) */
.ix-ctrl-panel {
  position: absolute; right: 10px; bottom: 10px;
  width: min(290px, calc(100% - 20px)); max-height: calc(100% - 20px);
  overflow-y: auto;
  background: rgba(12, 22, 38, 0.92); border: 1px solid rgba(199,212,234,0.2);
  border-radius: 12px; padding: 14px; color: #c7d4ea; font-size: 0.8125rem;
  z-index: 5; backdrop-filter: blur(8px);
}
.ix-ctrl-panel h3 { font-size: 0.875rem; margin: 0 0 10px; color: #fff; }
.ix-ctrl-panel label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.ix-ctrl-panel input[type="range"] { flex: 1; accent-color: var(--ix-color); }
.ix-ctrl-panel input[type="color"] { width: 32px; height: 24px; border: none; border-radius: 4px; }
.ix-ctrl-panel select, .ix-ctrl-panel button {
  background: rgba(199,212,234,0.12); border: 1px solid rgba(199,212,234,0.25);
  color: #c7d4ea; border-radius: 6px; padding: 4px 10px; font-size: 0.8125rem; cursor: pointer;
}
.ix-ctrl-panel button:hover { background: rgba(199,212,234,0.22); }
.ix-ctrl-group { margin-bottom: 10px; }
.ix-ctrl-group-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 4px; }

/* Lesson content below sim */
.lesson-content { padding: 16px; }

.lesson-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.ix-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
}
.ix-chip-cat { background: var(--md-primary-container); color: var(--md-on-primary); }
.ix-chip-simtype { background: var(--md-surface-container); color: var(--md-on-surface-variant); border: 1px solid var(--md-outline-variant); }
.ix-card-meta { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--md-on-surface-variant); }
.ix-card-meta .material-symbols-outlined { font-size: 16px; }

.objectives {
  background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant);
  border-radius: var(--md-radius-lg); padding: 16px; margin-bottom: 16px;
}
.objectives h2 { font-size: 0.9375rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.objectives ul { list-style: none; padding: 0; }
.objectives li { padding: 4px 0; font-size: 0.875rem; color: var(--md-on-surface-variant); display: flex; align-items: flex-start; gap: 6px; }
.objectives li .material-symbols-outlined { font-size: 16px; flex-shrink: 0; margin-top: 2px; }

.knowledge-section {
  background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant);
  border-radius: var(--md-radius-lg); padding: 16px; margin-bottom: 16px;
}
.knowledge-section h2 { font-size: 0.9375rem; font-weight: 700; margin-bottom: 8px; }
.knowledge-section p { font-size: 0.875rem; color: var(--md-on-surface-variant); margin-bottom: 8px; line-height: 1.6; }

.fun-fact {
  display: flex; align-items: flex-start; gap: 10px;
  background: linear-gradient(135deg, rgba(255,193,7,0.08), rgba(255,152,0,0.08));
  border: 1px solid rgba(255,193,7,0.25); border-radius: var(--md-radius-lg);
  padding: 14px; margin-bottom: 16px; font-size: 0.875rem;
}
.fun-fact .material-symbols-outlined { font-size: 22px; color: #ff9800; flex-shrink: 0; }
.fun-fact strong { color: var(--md-on-surface); }

/* Quiz */
.quiz-section {
  background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant);
  border-radius: var(--md-radius-lg); padding: 16px; margin-bottom: 16px;
}
.quiz-section h2 { font-size: 0.9375rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.quiz-question { margin-bottom: 16px; }
.quiz-question legend { font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; }
.quiz-options { display: flex; flex-direction: column; gap: 6px; }
.quiz-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--md-radius-md);
  border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-lowest);
  font-size: 0.8125rem; cursor: pointer; text-align: left; width: 100%;
  color: var(--md-on-surface);
}
.quiz-opt:hover { background: var(--md-primary-container); }
.quiz-opt.correct { background: #d1fae5; border-color: #10b981; color: #065f46; }
.quiz-opt.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
.quiz-opt.locked { pointer-events: none; opacity: 0.85; }
.quiz-opt .material-symbols-outlined { font-size: 18px; }
.quiz-explain { font-size: 0.8125rem; color: var(--md-on-surface-variant); margin-top: 6px; padding: 8px 10px; background: var(--md-surface-container); border-radius: 6px; }
.quiz-result {
  text-align: center; padding: 16px; border-radius: var(--md-radius-lg);
  font-size: 0.9375rem; font-weight: 600;
  background: var(--md-primary-container); color: var(--md-on-primary);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.quiz-result.ix-result-great { background: #d1fae5; color: #065f46; }

/* Buttons */
.md-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px; font-size: 0.8125rem; font-weight: 600;
  cursor: pointer; border: none; text-decoration: none;
}
.md-btn-tonal { background: var(--md-primary-container); color: var(--md-on-primary); }
.md-btn-icon {
  background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--md-on-surface-variant);
}
.md-btn-icon:hover { background: var(--md-surface-container); }

/* Material Symbols */
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal; font-style: normal; font-size: 20px;
  line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; word-wrap: normal;
  direction: ltr; -webkit-font-smoothing: antialiased;
}
</style>
<link rel="stylesheet" href="css/03-lesson.css">
<link rel="stylesheet" href="css/04-coding.css">
<link rel="stylesheet" href="css/05-robotics.css">
<link rel="stylesheet" href="css/06-space.css">
<link rel="stylesheet" href="css/07-labs.css">
<link rel="stylesheet" href="css/interactive.css">
</head>
<body>
<div class="ix-lesson-page" id="ix-lesson-root"
     style="--ix-color: {{COURSE_COLOR}};"
     data-course-slug="{{COURSE_SLUG}}"
     data-lesson-slug="{{LESSON_SLUG}}"
     data-sim-url="{{SIM_URL}}"
     data-sim-type="{{SIM_TYPE}}">

  <div class="ix-sim-shell" id="ix-sim-shell">
    <div id="sim-stage" class="ix-sim-stage" role="application" aria-label="Interactive simulation">
      <div class="ix-sim-loading" id="ix-sim-loading">
        <div class="ix-spinner"></div>
        <p>Loading simulation&hellip;</p>
      </div>
    </div>
    <div class="ix-sim-toolbar">
      <span class="ix-sim-hint" id="ix-sim-hint">
        <span class="material-symbols-outlined">tune</span>
        <span id="ix-sim-hint-text">Adjust the controls and watch what happens</span>
      </span>
      <button class="md-btn md-btn-icon ix-fullscreen-btn" id="ix-fullscreen-btn" aria-label="Fullscreen" title="Fullscreen">
        <span class="material-symbols-outlined">fullscreen</span>
      </button>
    </div>
  </div>

  <div class="lesson-content">
    <div class="lesson-meta" id="lesson-meta"></div>
    <div id="lesson-objectives"></div>
    <div id="lesson-knowledge"></div>
    <div id="lesson-funfact"></div>
    <div id="lesson-quiz"></div>
  </div>
</div>

<script>
(function() {
  var data = {{LESSON_DATA}};

  var meta = document.getElementById('lesson-meta');
  var chips = [];
  chips.push('<span class="ix-chip ix-chip-cat">Lesson ' + data.lessonIndex + ' of ' + data.totalLessons + '</span>');
  var typeLabels = {'3d':'3D model','lab':'Virtual lab','coding':'Coding game','2d':'Simulation'};
  chips.push('<span class="ix-chip ix-chip-simtype">' + (typeLabels[data.simType]||'Simulation') + '</span>');
  if (data.lessonMinutes > 0) chips.push('<span class="ix-card-meta"><span class="material-symbols-outlined">schedule</span>' + data.lessonMinutes + ' min</span>');
  meta.innerHTML = chips.join('');

  var hintEl = document.getElementById('ix-sim-hint-text');
  var hintIcons = {'3d':'touch_app','coding':'sports_esports','lab':'tune','2d':'tune'};
  if (hintEl) hintEl.textContent = data.simType === '3d' ? 'Drag to rotate \u00b7 pinch or scroll to zoom' : data.simType === 'coding' ? 'Play with the blocks and run your code' : 'Adjust the controls and watch what happens';

  if (data.objectives && data.objectives.length) {
    var html = '<div class="objectives"><h2><span class="material-symbols-outlined">flag</span>What you\'ll discover</h2><ul>';
    for (var i = 0; i < data.objectives.length; i++) html += '<li><span class="material-symbols-outlined">arrow_forward</span>' + data.objectives[i] + '</li>';
    html += '</ul></div>';
    document.getElementById('lesson-objectives').innerHTML = html;
  }

  if (data.knowledge && data.knowledge.length) {
    var html = '';
    for (var i = 0; i < data.knowledge.length; i++) {
      html += '<div class="knowledge-section"><h2>' + data.knowledge[i].heading + '</h2>';
      var body = data.knowledge[i].body;
      if (typeof body === 'string') body = body.split('\n').filter(function(p){return p.trim();});
      for (var j = 0; j < body.length; j++) html += '<p>' + body[j] + '</p>';
      html += '</div>';
    }
    document.getElementById('lesson-knowledge').innerHTML = html;
  }

  if (data.funFact) {
    document.getElementById('lesson-funfact').innerHTML = '<aside class="fun-fact"><span class="material-symbols-outlined">lightbulb</span><div><strong>Fun fact!</strong> ' + data.funFact + '</div></aside>';
  }

  if (data.quiz && data.quiz.length) {
    var html = '<div class="quiz-section"><h2><span class="material-symbols-outlined">quiz</span>Check your knowledge</h2>';
    for (var i = 0; i < data.quiz.length; i++) {
      var q = data.quiz[i];
      html += '<fieldset class="quiz-question"><legend>' + (i+1) + '. ' + q.q + '</legend><div class="quiz-options">';
      for (var j = 0; j < q.options.length; j++) {
        html += '<button type="button" class="quiz-opt" data-q="' + i + '" data-idx="' + j + '" data-ans="' + q.answer + '">' + q.options[j] + '</button>';
      }
      html += '</div>';
      if (q.explain) html += '<p class="quiz-explain" id="quiz-explain-' + i + '" hidden>' + q.explain + '</p>';
      html += '</fieldset>';
    }
    html += '<div class="quiz-result" id="quiz-result" hidden></div></div>';
    document.getElementById('lesson-quiz').innerHTML = html;

    var answered = 0, correct = 0;
    document.querySelectorAll('.quiz-opt').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var qi = parseInt(this.dataset.q);
        var idx = parseInt(this.dataset.idx);
        var ans = parseInt(this.dataset.ans);
        var opts = document.querySelectorAll('.quiz-opt[data-q="' + qi + '"]');
        opts.forEach(function(o) { o.classList.add('locked'); });
        if (idx === ans) { this.classList.add('correct'); correct++; } else { this.classList.add('wrong'); opts[ans].classList.add('correct'); }
        var explain = document.getElementById('quiz-explain-' + qi);
        if (explain) explain.hidden = false;
        answered++;
        if (answered === data.quiz.length) {
          var result = document.getElementById('quiz-result');
          result.hidden = false;
          var pct = Math.round((correct / data.quiz.length) * 100);
          result.textContent = pct === 100 ? 'Perfect! ' + correct + '/' + data.quiz.length : pct >= 60 ? 'Nice! ' + correct + '/' + data.quiz.length : 'Score: ' + correct + '/' + data.quiz.length + '. Try again!';
        }
      });
    });
  }
})();
</script>
<script type="module" src="js/core/lesson.js"></script>
</body>
</html>
