<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
  
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  svg {
    width: 100%;
    height: 100%;
  }

  .brand-word {
    font-family: 'Dancing Script', 'Segoe Script', 'Brush Script MT', cursive, sans-serif;
    font-weight: 700;
    font-size: 86px;
    fill: url(#brand);
  }
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 180" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#93C5FD"/>
        <stop offset="0.5" stop-color="#2563EB"/>
        <stop offset="1"   stop-color="#1E3A8A"/>
      </linearGradient>

      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"     stop-color="#fff"/>
        <stop offset="0.92"  stop-color="#fff"/>
        <stop offset="1"     stop-color="#000"/>
      </linearGradient>

      <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="432" height="180">
        <rect x="-460" y="0" width="460" height="180" fill="url(#edge)">
          <animate attributeName="x"
                   values="-460;0;0;-460;-460"
                   keyTimes="0;0.45;0.70;0.92;1"
                   keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1"
                   calcMode="spline"
                   dur="4.2s" repeatCount="indefinite"/>
        </rect>
      </mask>
    </defs>

    <g mask="url(#reveal)">
      <text class="brand-word" x="216" y="120" text-anchor="middle">Nebians</text>
    </g>
  </svg>
</body>
</html>
