<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBians Pathways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#004bd4;--onp:#fff;--pc:#DCE1FF;--onpc:#00164E;--sc:#E0E1F9;--onsc:#191B2C;
  --tc:#FFD7F5;--ontc:#380038;--yc:#FFE08A;--onyc:#241A00;--gc:#C4EFCB;--ongc:#00210C;--rc:#FFDAD4;--onrc:#3B0907;
  --s:#FBF8FF;--s1:#F5F2FA;--s2:#EFEDF4;--s3:#E3E1E9;--on:#1B1B21;--onv:#45464F;--ol:#C6C6D0;--board:#F3F1EA;
  --k0:var(--p);--k1:#C98A00;--k2:#B5479B;--k3:#1E8E4A;--k4:#D9532B;--k5:#6B6D7A;--k6:#A9ABB8;
  --sx:var(--s1);
  --e:cubic-bezier(.2,0,0,1);--sp:cubic-bezier(.34,1.56,.64,1);
}
[data-theme=dark]{
  --p:#B6C4FF;--onp:#002780;--pc:#00389F;--onpc:#DCE1FF;--sc:#404659;--onsc:#DCE1F9;
  --tc:#5B3D57;--ontc:#FFD7F5;--yc:#584400;--onyc:#FFE08A;--gc:#0F5223;--ongc:#C4EFCB;--rc:#73342B;--onrc:#FFDAD4;
  --s:#121318;--s1:#1B1B21;--s2:#1F1F25;--s3:#2E2F36;--on:#E4E1E9;--onv:#C6C6D0;--ol:#45464F;--board:#08090C;
  --k1:#FFD166;--k2:#FFACE8;--k3:#8BD99B;--k4:#FFB4A8;--k5:#A9ABB8;--k6:#6B6D7A;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
html{font-family:Poppins,sans-serif;font-variant-numeric:tabular-nums}
body{background:var(--board);color:var(--on);padding:20px 16px 40px;transition:background .3s}
button,input{font:inherit;color:inherit;border:0;background:none}
button,[role=button]{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.t-pc{--tb:var(--pc);--tf:var(--onpc)}.t-sc{--tb:var(--sc);--tf:var(--onsc)}.t-tc{--tb:var(--tc);--tf:var(--ontc)}
.t-yc{--tb:var(--yc);--tf:var(--onyc)}.t-gc{--tb:var(--gc);--tf:var(--ongc)}.t-rc{--tb:var(--rc);--tf:var(--onrc)}
.g0{--c:var(--k0)}.g1{--c:var(--k1)}.g2{--c:var(--k2)}.g3{--c:var(--k3)}.g4{--c:var(--k4)}.g5{--c:var(--k5)}.g6{--c:var(--k6)}
.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h4{font-size:12px;font-weight:600;color:var(--onv);margin:18px 0 8px}

/* board chrome */
.board{display:flex;align-items:center;gap:10px;max-width:1280px;margin:0 auto 18px}
.board h1{font-size:15px;font-weight:600;flex:1;letter-spacing:-.01em}
.seg{display:flex;gap:3px}
.seg button{height:40px;padding:0 18px;font-size:13px;font-weight:600;background:var(--s3);border-radius:8px;white-space:nowrap;transition:border-radius .35s var(--sp),background .2s}
.seg button:first-child{border-radius:20px 8px 8px 20px}.seg button:last-child{border-radius:8px 20px 20px 8px}
.seg button.on{background:var(--on);color:var(--s);border-radius:20px}
.seg.full{margin-bottom:10px}.seg.full button{flex:1;padding:0 6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);position:relative;flex:none;transition:border-radius .35s var(--sp),background .2s}
.ib:active{border-radius:14px}.ib.on{background:var(--p);color:var(--onp);border-radius:14px}
.cnt{position:absolute;top:-4px;right:6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--on);color:var(--s);font-size:10px;font-weight:600;display:grid;place-items:center}

/* device frame */
.frame{container-type:inline-size;container-name:app;margin:0 auto;background:var(--s);overflow:hidden}
.frame[data-dev=phone]{width:min(400px,100%);height:860px;border-radius:48px;border:10px solid var(--on)}
.frame[data-dev=web]{width:min(1280px,100%);height:820px;border-radius:24px;border:1px solid var(--ol)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:var(--s);color:var(--on);position:relative;overflow:hidden}

/* top */
.top{padding:16px 16px 0}
.tbar{display:flex;align-items:center;gap:8px}
.brand{font-weight:600;font-size:21px;letter-spacing:-.02em;flex:1}
#q{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--s2);padding:0 18px;font-size:15px;font-weight:500;outline:0}
.trail{display:flex;align-items:center;overflow:auto;padding:12px 0 2px}
.tc{flex:none;height:30px;padding:0 12px;border-radius:15px;font-size:12px;font-weight:600;background:var(--s2);color:var(--onv);white-space:nowrap}
.tc.on{background:var(--on);color:var(--s)}
.sep{flex:none;width:10px;height:2px;background:var(--ol)}

/* main */
#main{overflow:auto;padding:14px 0 20px}
.wrap{max-width:860px;margin:0 auto}
.pad{padding:0 16px}
.stages{display:flex;align-items:center;gap:6px;overflow:auto;padding:0 16px 14px;position:relative}
.pad .stages{margin:0 -16px}
.stg{flex:none;height:38px;min-width:44px;padding:0 14px;border-radius:19px;background:var(--s2);font-size:13px;font-weight:600;white-space:nowrap;transition:border-radius .3s var(--sp)}
.stg:active{border-radius:14px}
.stg.on{background:var(--p);color:var(--onp);height:38px;padding:0 18px;border-radius:14px;font-size:13px;font-weight:600;letter-spacing:0}
.fresh .stg.on{animation:pop .55s var(--sp)}
.grp{display:flex;gap:3px;overflow:auto;padding:0 16px 6px}
.gb{flex:1 0 auto;height:44px;padding:0 16px;font-size:13px;font-weight:600;background:var(--s2);border-radius:8px;white-space:nowrap;transition:border-radius .35s var(--sp),background .2s}
.gb:first-child{border-radius:22px 8px 8px 22px}.gb:last-child{border-radius:8px 22px 22px 8px}.gb:only-child{border-radius:22px}
.gb.on{background:var(--tb,var(--on));color:var(--tf,var(--s));border-radius:22px}
.lens{display:flex;justify-content:flex-end;gap:6px;padding:8px 16px 0}
.nav{display:flex;background:var(--s1);padding:10px 8px}
.nav button{flex:1;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--onv)}
.nav i{position:relative;width:48px;height:40px;border-radius:20px;display:grid;place-items:center;font-style:normal;transition:background .25s,width .45s var(--sp)}
.nav .on{color:var(--onpc)}.nav .on i{background:var(--pc);width:64px}
.lens .lk{display:none;height:32px;padding:0 14px;border-radius:16px;background:var(--s2);font-size:12px;font-weight:600;transition:border-radius .35s var(--sp),background .2s}
.lens .lk.show{display:block;animation:rise .4s var(--sp) both}
.lens .lk.on{background:var(--on);color:var(--s);border-radius:10px}
.lg{display:flex;gap:6px;margin-left:auto}
.flow path{fill:none;stroke:var(--p);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw .55s var(--e) both;animation-delay:calc(var(--i)*30ms)}
.nd.gone{max-height:0;min-height:0;padding-top:0;padding-bottom:0;margin-top:-8px;opacity:0;pointer-events:none}
.rz{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rz i{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,currentColor 10%,transparent)}
.nm{position:relative;aspect-ratio:4000/2299;border-radius:28px;background:var(--s1);overflow:hidden;margin-bottom:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.nm svg.nmw,.nm svg.nml{position:absolute;inset:0;width:100%;height:100%}
.nm .nml{pointer-events:none}
.nm .nmw path{vector-effect:non-scaling-stroke}
.nm .nb0{fill:var(--s3)}
.nm .nb1{fill:color-mix(in srgb,var(--p) 20%,var(--s3))}
.nm .nb2{fill:color-mix(in srgb,var(--p) 38%,var(--s3))}
.nm .nb3{fill:color-mix(in srgb,var(--p) 58%,var(--s3))}
.nm .nb4{fill:color-mix(in srgb,var(--p) 80%,var(--s3))}
.nm .nsel{fill:var(--p)}
.nm .nbd{fill:none;stroke:color-mix(in srgb,var(--on) 26%,transparent);stroke-width:.8;stroke-linejoin:round}
.nm .npv{fill:none;stroke:color-mix(in srgb,var(--on) 50%,transparent);stroke-width:1.5;stroke-linejoin:round}
.nm .nol{fill:none;stroke:var(--on);stroke-width:2;stroke-linejoin:round}
.nm .nso{fill:none;stroke:var(--on);stroke-width:2.4;stroke-linejoin:round}
.nm text{font-family:inherit;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:color-mix(in srgb,var(--s) 88%,transparent);stroke-width:2.2px;stroke-linejoin:round;fill:var(--on);font-weight:400}
.nm text.lp{font-weight:500;letter-spacing:1.3px;fill:var(--onv);stroke:none;opacity:.7}
.nm text.on{fill:var(--onp);stroke:none;font-weight:500}
.nmi{position:absolute;left:12px;top:12px;max-width:60%;background:var(--s);border-radius:18px;padding:8px 14px;pointer-events:none;animation:rise .35s var(--sp) both}
.nmi[hidden]{display:none}
.nmi b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.nmi span{font-size:11px;font-weight:500;color:var(--onv)}
.nmc{position:absolute;right:12px;top:12px;display:grid;gap:8px}
.nmc .ib{width:40px;height:40px;background:var(--s)}
.vsa{grid-column:1/-1}
.vsa>small{display:flex;justify-content:space-between}
.vs{list-style:none;display:grid;margin-top:6px}
.vs li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding-bottom:12px;animation:rise .45s var(--sp) both;animation-delay:calc(var(--i)*40ms)}
.vs li:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--pc)}
.vs li>button{width:32px;height:32px;border-radius:12px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-size:13px;font-weight:600;transition:border-radius .35s var(--sp),background .2s}
.vs li.d>button{background:var(--p);color:var(--onp);border-radius:16px}
.vs li span{display:block;font-size:14px;font-weight:600;line-height:1.3;padding-top:5px}
.vs li.d span{opacity:.55;text-decoration:line-through}
.vs li small{display:block;font-size:12px;font-weight:500;color:var(--onv);margin:1px 0 0}
.vs li em{display:block;font-style:normal;font-size:12px;font-weight:500;color:var(--onv);margin-top:2px}
.vs .tg{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:8px;background:var(--gc);color:var(--ongc);margin-left:6px}

.lz{height:32px;padding:0 14px;border-radius:16px;background:var(--s2);font-size:12px;font-weight:600;transition:border-radius .35s var(--sp),background .2s}
.lz.on{background:var(--on);color:var(--s);border-radius:10px}

/* route map */
.flow{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:18px 16px 8px;align-items:center;min-height:300px}
.flow>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.fresh .flow>svg{animation:fade .5s .3s both}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.nd{position:relative;overflow:hidden;min-height:48px;border-radius:24px;padding:6px 14px;font-size:13px;font-weight:600;line-height:1.2;text-align:left;background:var(--s2);display:flex;align-items:center;gap:8px;overflow-wrap:anywhere;transition:transform .4s var(--sp),border-radius .4s var(--sp),background .2s,color .2s,opacity .25s}
.nd{max-height:120px;transition:transform .4s var(--sp),border-radius .4s var(--sp),background .2s,color .2s,opacity .25s,max-height .42s var(--e),min-height .42s var(--e),padding .42s var(--e),margin .42s var(--e)}
.nd span,.nd small,.nd .sig{position:relative}
.nd span{flex:1}.nd small{font-size:11px;font-weight:600;opacity:.7;white-space:nowrap}.nd small:empty{display:none}
.fl{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:currentColor;opacity:.14;transition:width .5s var(--e);pointer-events:none}
.nd.lit{background:var(--pc);color:var(--onpc)}
.nd.on{background:var(--p);color:var(--onp);border-radius:14px;transform:scale(1.05)}
.nd.dim{opacity:.38}
.fresh .nd{animation:rise .5s var(--sp) both;animation-delay:calc(var(--i)*35ms)}
.sig{width:14px;height:14px;flex:none}.sig rect{fill:currentColor;opacity:.25}.sig .f{opacity:1}

/* peek */
.peek{padding:0 12px;max-height:0;overflow:hidden;transition:max-height .4s var(--e)}
.peek.show{max-height:110px;padding-bottom:8px}
.pk{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;background:var(--tb);color:var(--tf);border-radius:28px;padding:12px 12px 12px 20px;animation:rise .45s var(--sp)}
.pk>div:not(.ring)>b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}.pk>div:not(.ring)>span{font-size:12px;font-weight:500;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk>div:first-child{min-width:0}
.pk .tr{stroke:color-mix(in srgb,var(--tf) 14%,transparent)}
.go{width:48px;height:48px;border-radius:16px;background:var(--tf);color:var(--tb);display:grid;place-items:center}

/* nav */

/* sheet */
.sheet{--sbg:var(--s);position:absolute;inset:0;z-index:5;background:var(--sbg);display:flex;flex-direction:column;overflow:auto;transform:translateY(103%);transition:transform .5s var(--e)}
.sheet.open{transform:none}.sheet>*{flex-shrink:0}
.hero{background:var(--tb);color:var(--tf);border-radius:0 0 36px 36px;padding:14px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:end}
.hr{grid-column:1/-1;display:flex;justify-content:space-between;margin-bottom:10px}
.hero .ib{background:color-mix(in srgb,var(--tf) 10%,transparent)}.hero .ib.on{background:var(--tf);color:var(--tb)}
.hero h2{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.05;align-self:end}
.hero p{align-self:start;font-size:13px;font-weight:500;opacity:.78;margin-top:4px}
.badge{grid-column:2;grid-row:2/4;width:92px;height:92px;position:relative;display:grid;place-items:center}
.badge>svg{position:absolute;inset:0;fill:var(--tf);transform-origin:center}.spin{animation:spin 28s linear infinite}
.badge div{position:relative;color:var(--tb);text-align:center;line-height:1}
.badge b{font-size:22px;font-weight:600;display:block}.badge small{font-size:11px;font-weight:600;display:block}
.badge .sig{width:34px;height:34px}
.meters{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:16px;padding:18px 20px 16px;align-items:center}
.ring{display:grid;justify-items:center;gap:2px;position:relative}
.ring svg{width:64px;height:64px}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .tr{stroke:var(--s3)}
.ring .fg{stroke-dasharray:100;transform:rotate(-90deg);transform-origin:22px 22px;animation:ring 1s var(--e) both;transition:stroke-dashoffset .5s var(--e)}
.ring.still .fg{animation:none}
.ring b{position:absolute;top:0;left:0;right:0;height:64px;display:grid;place-items:center;font-size:17px;font-weight:600;line-height:1}.ring svg{flex:none}
.ring span{font-size:11px;font-weight:500;color:var(--onv)}
.ring.s svg{width:46px;height:46px}.ring.s b{height:46px;font-size:13px}
.pay{background:var(--s2);border-radius:22px;padding:12px 16px;min-width:0}
.pay b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}.pay span{font-size:11px;font-weight:500;color:var(--onv)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:16px 16px 14px}
.fact{background:var(--s2);border-radius:18px;padding:10px 12px;min-width:0}
.fact small{display:block;font-size:10.5px;font-weight:500;color:var(--onv)}
.fact b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;overflow:auto;padding:0 16px}
.tabs button,.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--s2);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:border-radius .35s var(--sp),background .2s}
.tabs .on,.chip.on{background:var(--on);color:var(--s);border-radius:12px}
#tabp{padding:18px 16px 20px}
#tabp>h4:first-child{margin-top:0}
.steps{display:grid}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:62px;width:100%;text-align:left;position:relative;animation:rise .5s var(--sp) both;animation-delay:calc(var(--i)*50ms)}
.step>b{width:40px;height:40px;border-radius:14px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-size:15px;font-weight:600;position:relative;z-index:1;transition:border-radius .35s var(--sp),background .2s}
.step:not(:last-child)::before{content:"";position:absolute;left:19px;top:50%;height:100%;width:2px;background:var(--pc)}
.step span{font-size:15px;font-weight:600;line-height:1.25}
.step small{display:block;font-size:12px;font-weight:500;color:var(--onv);margin-top:1px}
.step em{font-style:normal;font-size:14px;font-weight:600}
.ck>b i{font-style:normal}.ck>b svg{display:none}
.ck.done>b{background:var(--p);color:var(--onp);border-radius:50%}.ck.done>b svg{display:block}.ck.done>b i{display:none}.ck.done span{opacity:.5}
.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;padding:12px 16px;border-radius:20px;background:var(--s1);margin-bottom:6px;transition:border-radius .35s var(--sp)}
button.row:active{border-radius:10px}
.row b{font-size:14px;font-weight:600}.row em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--onv)}
.rb{grid-column:1/-1;height:8px;border-radius:4px;background:var(--s3);position:relative}
.rb i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--p);animation:grow .7s var(--e) both;transform-origin:left}
.rb.still i{animation:none}
.big{margin-top:16px;background:var(--yc);color:var(--onyc);border-radius:28px;padding:18px 22px}
.big b{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;display:block}.big span{font-size:12.5px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:block;width:100%;text-align:left;background:var(--s1);border-radius:22px;padding:14px 16px}.tile:first-child{grid-column:1/-1;background:var(--pc);color:var(--onpc)}
.tile.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.tile small{font-size:11px;font-weight:500;opacity:.7;display:block}.tile b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:14px}.chips.w{flex-wrap:wrap}.chips.z{padding:0}
.bf{display:grid;gap:10px}.bfh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.bfh b:last-child{color:var(--p)}
.bfr{display:grid;grid-template-columns:40px 1fr 86px 1fr 40px;gap:6px;align-items:center;font-size:12px;font-weight:600}
.bfr em{font-style:normal;text-align:center;color:var(--onv);font-weight:500}
.bfr div{height:14px;display:flex}.bfr .ba{justify-content:flex-end}
.bfr i{height:100%;min-width:4px;border-radius:7px;animation:grow .6s var(--e) both}
.ba i{background:var(--on);transform-origin:right}.bb i{background:var(--p);transform-origin:left}.bfr .vb{text-align:right;color:var(--p)}
.acts{margin-top:auto;position:sticky;bottom:0;display:flex;gap:8px;padding:12px 16px 16px;background:var(--sbg,var(--s))}
.btn{flex:1;height:56px;border-radius:28px;padding:0 20px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap;transition:border-radius .35s var(--sp)}
.btn:active{border-radius:16px}.btn.f{background:var(--p);color:var(--onp)}.btn.t{background:var(--pc);color:var(--onpc)}
.blk{padding:0 16px 18px}.blk h4{margin-top:0}
.curve,.radar{display:block;width:100%;height:auto}
.plot{display:block;width:100%;height:auto;border-radius:24px;background:var(--s1)}

.plot circle{fill:var(--ol);cursor:pointer}.plot circle.me{fill:var(--p)}
.mk-v{border-radius:24px;padding:16px 18px;background:var(--tb);color:var(--tf);display:grid;gap:2px;margin-bottom:14px}
.mk-v b{font-size:18px;font-weight:600;letter-spacing:-.02em}.mk-v span{font-size:13px;font-weight:500}.mk-v em{font-style:normal;font-size:12px;font-weight:600;opacity:.75;margin-top:4px}
.t-gc{--tb:var(--gc);--tf:var(--ongc)}.t-yc{--tb:var(--yc);--tf:var(--onyc)}.t-rc{--tb:var(--rc);--tf:var(--onrc)}
.mk-b{display:grid;grid-template-columns:128px 1fr 26px;gap:10px;align-items:center;margin:8px 0;font-size:13px;font-weight:600}
.mk-b b{text-align:right}.mk-t{height:12px;border-radius:6px;background:var(--s3);overflow:hidden}.mk-t i{display:block;height:100%;border-radius:6px}
.mk-t .a{background:var(--p)}.mk-t .b{background:var(--onv)}
.mk h5{font-size:12px;font-weight:600;color:var(--onv);margin:18px 0 6px}
.mk-r{width:100%;display:grid;grid-template-columns:22px 1fr 84px;gap:8px;align-items:center;text-align:left;padding:9px 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--s1);margin-bottom:4px}

.mk-g{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}.mk-g i{display:block;height:100%;background:var(--p);border-radius:4px}

.skill{height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--ol);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center}

.rg.on{background:var(--on);color:var(--s);border-radius:22px}
.rdy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}

.rung b{font-size:13px;font-weight:600;white-space:nowrap}.rung.on{background:var(--p);color:var(--onp);border-radius:24px}.rung.dim{opacity:.45}

/* split bar */
.sbar{display:flex;gap:3px;height:40px}
.sbar button{min-width:6px;border-radius:8px;background:var(--c);transition:opacity .2s,border-radius .35s var(--sp)}
.sbar button:first-child{border-radius:20px 8px 8px 20px}.sbar button:last-child{border-radius:8px 20px 20px 8px}.sbar button:only-child{border-radius:20px}

.sleg{display:grid;margin-top:8px}

.sleg button.on{background:var(--s2);font-weight:600}
.sleg i{width:12px;height:12px;border-radius:4px;background:var(--c)}.sleg b{font-weight:600}
.waf{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin:14px 0 4px}
.waf i{aspect-ratio:1;border-radius:50%;background:var(--s3)}.waf i.me{background:var(--p)}.waf i.one{transform:scale(1.7)}

/* calendar strip */
.mo{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;--mf:var(--tf,var(--p));--mb:var(--tb,var(--onp))}
.mo i{height:20px;border-radius:6px;font-style:normal;font-size:9px;font-weight:600;display:grid;place-items:center;background:color-mix(in srgb,var(--mf) 10%,transparent)}
.mo i.f{background:var(--mf);color:var(--mb)}.mo i.now{outline:2px solid var(--on);outline-offset:1px}
.cal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;font-size:11px;font-weight:600;color:var(--onv)}
.cal .mo{grid-column:2;color:var(--on)}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:none;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:var(--pc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:44px;border-radius:7px;background:var(--p);border:4px solid var(--sbg,var(--s));margin-top:-14px}
input[type=range]::-moz-range-track{height:16px;border-radius:8px;background:var(--pc)}
input[type=range]::-moz-range-thumb{width:6px;height:36px;border-radius:7px;background:var(--p);border:4px solid var(--sbg,var(--s))}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.sl output{font-size:13px;font-weight:600;white-space:nowrap;min-width:64px;text-align:right}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:8px}

/* colleges */
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--s1);margin-bottom:6px}

.crow b{font-size:14.5px;font-weight:600;display:block;line-height:1.25}.crow span{font-size:12px;font-weight:500;color:var(--onv)}
.tag{height:26px;padding:0 10px;border-radius:9px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;background:var(--tb);color:var(--tf)!important}
.fee{height:8px;border-radius:4px;background:var(--s3)}.fee i{display:block;height:100%;min-width:8px;border-radius:4px;background:var(--p)}
.crow .fv{font-size:13px;font-weight:600;text-align:right}
.empty{display:grid;justify-items:center;gap:10px;padding:40px 0;font-size:14px;font-weight:600;color:var(--onv)}
.empty svg{width:72px;fill:var(--s3)}

/* pay ladder */
.lad{display:grid;gap:6px;margin-bottom:14px}
.lr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;background:var(--s1);transition:background .2s}
.lr u{grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;text-decoration:none;font-size:12px;font-weight:600}
.lr b{font-size:14px;font-weight:600;display:block}.lr small{font-size:12px;color:var(--onv);display:block}
.lr em{font-style:normal;font-size:14px;font-weight:600;white-space:nowrap}
.lr .lb{grid-column:2/4;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}.lr .lb i{display:block;height:100%;background:var(--p);border-radius:3px}
.lr.on{background:var(--pc);color:var(--onpc)}.lr.on u{background:var(--p);color:var(--onp)}.lr.on small{color:inherit;opacity:.75}.lr.on .lb{background:color-mix(in srgb,var(--onpc) 14%,transparent)}
.exr{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}.exr input{flex:1;min-width:0}.exr output{min-width:48px;text-align:right}
/* abroad */
.abin{display:grid;gap:2px;margin:4px 0 12px}.abin b{font-size:15px;font-weight:600}.abin span{font-size:12px;color:var(--onv)}
.abkey{display:flex;gap:14px;font-size:11.5px;font-weight:500;color:var(--onv);margin-bottom:10px;flex-wrap:wrap}.abkey span{display:inline-flex;align-items:center;gap:6px}
.abkey i{width:10px;height:10px;border-radius:3px;display:inline-block}.abkey .a,.abb .a{background:var(--p)}.abkey .b,.abb .b{background:var(--ol)}
.abkey s,.abb s{display:inline-block;width:2px;height:12px;background:var(--on);border-radius:1px}
.ab{background:var(--s1);border-radius:22px;padding:14px;margin-bottom:8px;display:grid;gap:10px;cursor:pointer;transition:opacity .25s}
.ab.over:not(.on){opacity:.6}
.abh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.abc{width:40px;height:40px;border-radius:12px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-size:13px;font-weight:600}
.abn b{font-size:15px;font-weight:600;display:block}.abn small,.abt small{font-size:11.5px;color:var(--onv);display:block}
.abt{text-align:right}.abt b{font-size:15px;font-weight:600;display:block;white-space:nowrap}
.abb{position:relative;display:flex;height:10px;border-radius:5px;background:var(--s3);overflow:visible}
.abb i{display:block;height:100%}.abb i.a{border-radius:5px 0 0 5px}.abb i.b{border-radius:0 5px 5px 0}
.abb s{position:absolute;top:-3px;width:2px;height:16px;transform:translateX(-1px)}
.abp{display:flex;justify-content:space-between;font-size:12px;color:var(--onv)}
.abp .pl{font-weight:600;padding:3px 10px;border-radius:10px;background:var(--gc);color:var(--ongc)}.ab.over .pl{background:var(--rc);color:var(--onrc)}
.abx{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px solid var(--s3)}
.abx small{font-size:11px;color:var(--onv);display:block;margin-bottom:2px}.abx b{font-size:14px;font-weight:600}.abx .w2{grid-column:1/-1}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cc{background:var(--tb);color:var(--tf);border-radius:28px;padding:14px;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center;transition:opacity .25s,border-radius .4s var(--sp)}
.fresh .cc{animation:rise .5s var(--sp) both;animation-delay:calc(var(--i)*40ms)}
.cc.dim{opacity:.3}.cc.on{grid-column:1/-1;border-radius:36px}
.cb{width:48px;height:48px;position:relative;display:grid;place-items:center}
.cb svg{position:absolute;inset:0;fill:var(--tf);transform-origin:center;transition:transform .6s var(--sp)}.cc.on .cb svg{transform:rotate(45deg) scale(1.1)}
.cb b{position:relative;color:var(--tb);font-size:13px;font-weight:600}
.cco b{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1;display:block}.cco small,.more small{font-size:10.5px;font-weight:500;opacity:.75;display:block}
.cnm{grid-column:1/-1;font-size:14px;font-weight:600}
.more{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;margin-top:4px}
.more b{font-size:15px;font-weight:600;line-height:1.2;display:block}
.more .chips{grid-column:1/-1;padding:4px 0 0}
.cc .chip{background:var(--tf);color:var(--tb)}

/* funding */
.srow{padding:14px 16px;border-radius:22px;background:var(--s1);margin-bottom:6px;display:grid;gap:10px}
.sh{display:flex;align-items:center;gap:8px}.sh b{font-size:14.5px;font-weight:600;flex:1;line-height:1.25}
.sh em{font-style:normal;font-size:12px;font-weight:600;color:var(--onv);white-space:nowrap}
.cd{height:24px;padding:0 8px;border-radius:8px;background:var(--s3);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center}
.srow:not(.open) .mo{--mf:var(--onpc);--mb:var(--onpc)}.srow:not(.open) .mo i.f{background:var(--pc)}
.sx{display:grid;gap:10px}.sxa{display:flex;align-items:center;gap:8px}.sxa b{flex:1;font-size:13px;font-weight:600}.sxa .btn{flex:none;height:44px}

/* lists */
.mad{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:6px 0 10px}
.mad output{color:var(--p)}
.mrow,.lrow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:10px 16px 10px 12px;border-radius:24px;background:var(--s1);margin-bottom:6px;transition:border-radius .35s var(--sp),background .2s,opacity .25s}
.mrow:first-child{background:var(--pc);color:var(--onpc)}.mrow:first-child .tr{stroke:color-mix(in srgb,var(--onpc) 14%,transparent)}
.mrow>div:not(.ring)>b,.lrow b{font-size:15px;font-weight:600;display:block}.mrow>div:not(.ring)>span,.lrow span{font-size:12px;font-weight:500;opacity:.72;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow{grid-template-columns:minmax(0,1fr) auto;padding:14px 18px}.lrow em{font-style:normal;font-size:11px;font-weight:600;color:var(--onv)}
.lrow em.v{font-size:15px;font-weight:600;color:inherit;letter-spacing:-.01em;white-space:nowrap}
.lrow.on{background:var(--pc);color:var(--onpc);border-radius:16px}.lrow.no{opacity:.45}

/* guides */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gd{background:var(--tb);color:var(--tf);border-radius:28px;padding:16px;text-align:left;display:grid;gap:10px;align-content:space-between;min-height:136px;transition:border-radius .4s var(--sp)}
.gd:active,.gd.on{border-radius:16px}
.gd b{font-size:15.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.gm{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600}
.gp{height:6px;border-radius:3px;background:var(--s3)}.gp i{display:block;height:100%;border-radius:3px;background:var(--p);transition:width .4s var(--e)}
.gp.lg{height:12px;border-radius:6px}.gp.lg i{border-radius:6px}
.gd .gp{background:color-mix(in srgb,var(--tf) 14%,transparent)}.gd .gp i{background:var(--tf)}

/* plan */
.hl{background:var(--tb);color:var(--tf);border-radius:32px;padding:20px;margin:14px 0 4px}
.hl>b{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1;display:block}
.tl{display:flex;gap:3px;height:56px;margin:14px 0 10px}
.tl div{border-radius:10px;background:color-mix(in srgb,var(--tf) 10%,transparent);display:grid;align-content:center;padding:0 12px;min-width:0;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap}
.tl div:first-child{border-radius:28px 10px 10px 28px}
.tl .end{flex:none;background:var(--tf);color:var(--tb);border-radius:10px 28px 28px 10px;padding:0 16px;font-size:15px;font-weight:600}
.tl small{font-size:10.5px;font-weight:500;opacity:.75}
.hl .facts{padding:0}.hl .fact{background:color-mix(in srgb,var(--tf) 8%,transparent)}.hl .fact small{color:inherit;opacity:.7}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes pop{from{transform:scale(.8)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ring{from{stroke-dashoffset:100}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* web layout: driven by the frame, not the viewport */
@container app (min-width:900px){
  .app{grid-template-columns:96px minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .nav{grid-column:1;grid-row:1/-1;flex-direction:column;justify-content:center;gap:18px;padding:0}
  .nav button{flex:none}
  .top{grid-column:2;grid-row:1;padding:24px 32px 0}.brand{font-size:32px}
  #main{grid-column:2;grid-row:2;padding:20px 16px 28px}
  .peek{display:none}
  .sheet{--sbg:var(--sx);--s1:var(--s);--s2:var(--s);position:static;transform:none;transition:none;grid-column:3;grid-row:1/-1;width:440px;margin:12px;border-radius:32px;display:none}
  .sheet.open{display:flex}
  .sheet .hero{border-radius:32px}.sheet .x{visibility:hidden}
  .flow{gap:120px;padding-top:28px}.nd{min-height:54px;font-size:14.5px;padding:8px 18px;border-radius:27px}
  .cgrid{grid-template-columns:repeat(4,1fr)}.cc.on{grid-column:span 2}
  .ggrid{grid-template-columns:repeat(3,1fr)}
  .mad{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== match wizard + results ===== */
.app.quiz{grid-template-rows:minmax(0,1fr)}.app.quiz>#top,.app.quiz>#nav{display:none}
#main:has(.qz){padding:0;overflow:hidden}
.qz{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;width:100%}
.qh{display:flex;align-items:center;gap:10px;padding:14px 12px 4px 16px}
.qp{flex:1;display:flex;gap:4px}.qp i{flex:1;height:6px;border-radius:3px;background:var(--s3);position:relative;overflow:hidden}
.qp i.f{background:var(--p)}.qp i.c.still::after{animation:none}.qp i.c::after{content:"";position:absolute;inset:0;background:var(--p);transform-origin:left;animation:grow .5s var(--e) both}
.qs{height:44px;min-width:56px;padding:0 12px;border-radius:22px;font-size:13px;font-weight:600;color:var(--onv)}
.qb{flex:1;min-height:0;overflow:auto;padding:20px 16px 12px}
.qb.in{animation:qin .45s var(--e) both}.qb.rev{animation:qrev .45s var(--e) both}
@keyframes qin{from{opacity:0;transform:translateX(32px)}}@keyframes qrev{from{opacity:0;transform:translateX(-32px)}}
.qt{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.08}
.qd{font-size:14px;font-weight:500;color:var(--onv);margin:8px 0 20px;line-height:1.4}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qg.one{grid-template-columns:1fr}.qg.three{grid-template-columns:repeat(3,1fr)}
.qo{text-align:left;padding:14px 34px 14px 16px;border-radius:22px;background:var(--s1);min-height:64px;display:grid;align-content:center;gap:2px;position:relative;transition:background .2s,border-radius .35s var(--sp),transform .2s}
.qo b{font-size:15px;font-weight:600;line-height:1.2}.qo span{font-size:12px;font-weight:500;color:var(--onv);line-height:1.3}
.qo:active{border-radius:14px;transform:scale(.97)}
.qo.on{background:var(--p);color:var(--onp);border-radius:14px}.qo.on span{color:inherit;opacity:.8}
.qo::after{content:"";position:absolute;top:50%;right:14px;width:7px;height:13px;margin-top:-9px;border:solid currentColor;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .3s var(--sp)}
.qo.on::after{transform:rotate(45deg) scale(1)}
.qf{padding:10px 16px 18px;display:grid;gap:6px}.qf .btn{width:100%;flex:none}.qf .btn[disabled]{opacity:.38}
.qn{text-align:center;font-size:12px;font-weight:600;color:var(--onv);min-height:16px}
.qld{display:grid;justify-items:center;align-content:center;gap:18px;height:100%;text-align:center}
.qld .qhero{width:150px;height:150px;position:relative;color:var(--onpc);display:grid;place-items:center}
.qhero svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--pc)}.qhero b{position:relative;font-size:34px;font-weight:700}
.qld p{font-size:16px;font-weight:600;min-height:24px;animation:fade .4s both}
.mh{background:var(--pc);color:var(--onpc);border-radius:32px;padding:26px 22px 22px;margin:6px 0 12px;display:grid;gap:14px;overflow:hidden}
.mh .qhero{width:120px;height:120px;position:relative;display:grid;place-items:center}.mh .qhero svg{fill:var(--p);opacity:.9}.mh .qhero b{color:var(--onp);font-size:26px}
.mh h3{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.08}.mh p{font-size:14px;font-weight:500;line-height:1.45;opacity:.85}
.mh .btn{width:100%;flex:none}.mh .btn.t{background:color-mix(in srgb,var(--onpc) 10%,transparent);color:var(--onpc)}
.mhd{display:flex;align-items:center;gap:10px;margin:6px 0 12px}.mhd div{flex:1;min-width:0}
.mhd b{font-size:24px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1.1}.mhd span{font-size:12.5px;font-weight:500;color:var(--onv)}
.btn.sm{flex:none;height:40px;padding:0 16px;font-size:13px}
.note{background:var(--yc);color:var(--onyc);border-radius:20px;padding:12px 16px;font-size:13px;font-weight:600;margin-bottom:10px;line-height:1.4}
.mc{background:var(--s1);border-radius:26px;margin-bottom:8px;overflow:hidden}
.mc.top{background:var(--pc);color:var(--onpc)}.mc.top .tr{stroke:color-mix(in srgb,var(--onpc) 14%,transparent)}
.mt{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:12px 16px 12px 12px}
.mt b{font-size:15px;font-weight:600;display:block}.mt>div>span{font-size:12px;font-weight:500;opacity:.72;display:block}
.chv{display:grid;transition:transform .3s var(--e)}.mc.open .chv{transform:rotate(90deg)}
.md{padding:2px 16px 16px;display:grid;gap:8px;animation:fade .3s both}
.fb{display:grid;grid-template-columns:76px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12px;font-weight:600}
.fb div{height:8px;border-radius:4px;background:color-mix(in srgb,currentColor 12%,transparent);overflow:hidden}
.fb i{display:block;height:100%;border-radius:4px;background:currentColor;transform-origin:left;animation:grow .6s var(--e) both}.fb b{text-align:right}
.md .facts{padding:6px 0 2px}.mc.top .fact{background:color-mix(in srgb,var(--onpc) 8%,transparent)}.mc.top .fact small{color:inherit;opacity:.7}
.mx{display:flex;gap:8px;margin-top:2px}.mx .btn{height:46px;font-size:14px}.mx .ib{width:46px;height:46px}
.mw{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 6px;font-size:13px;font-weight:600;color:var(--onv)}
.tips{display:grid;gap:6px;text-align:left;width:100%}.tips div{background:var(--s2);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:500;line-height:1.35}
.nom{display:grid;justify-items:center;gap:12px;padding:30px 18px 22px;background:var(--s1);border-radius:32px;text-align:center}
.nom h3{font-size:22px;font-weight:700;letter-spacing:-.02em}.nom p{font-size:13.5px;color:var(--onv);font-weight:500;line-height:1.4}
.nom svg{width:84px;fill:var(--s3)}.nom .btn{width:100%;flex:none}
/* ===== exams revamp ===== */
.xp{background:var(--s1);border-radius:28px;padding:14px 14px 4px;margin-bottom:12px}
.xp small{display:block;font-size:11.5px;font-weight:600;color:var(--onv);margin:0 2px 10px}
.xsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.xsum div,.xsum button{border-radius:20px;padding:10px 14px;background:var(--s2)}.xsum b{font-size:24px;font-weight:700;display:block;letter-spacing:-.02em;line-height:1.1}.xsum small{font-size:11px;font-weight:600}
.xsum .g{background:var(--gc);color:var(--ongc)}.xsum .y{background:var(--yc);color:var(--onyc)}
.xc{width:100%;text-align:left;display:grid;gap:10px;padding:14px 16px;border-radius:24px;background:var(--s1);margin-bottom:8px;transition:border-radius .35s var(--sp),background .2s}
.xc:active{border-radius:16px}.xc.on{background:var(--pc);color:var(--onpc)}.xc.no{opacity:.55}
.xh{display:flex;gap:10px;align-items:flex-start}.xh>div{flex:1;min-width:0}.xh b{font-size:15px;font-weight:600;display:block;line-height:1.25}.xh span{font-size:12px;font-weight:500;opacity:.72}
.pill{height:26px;padding:0 11px;border-radius:13px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.pill.open{background:var(--gc);color:var(--ongc)}.pill.soon{background:var(--yc);color:var(--onyc)}.pill.no{background:var(--s3);color:var(--onv)}
.xm{display:flex;gap:6px 14px;font-size:12px;font-weight:600;color:var(--onv);flex-wrap:wrap}.xc.on .xm{color:inherit}
.xc .mo{--mf:var(--p);--mb:var(--onp)}.xc.on .mo{--mf:var(--onpc);--mb:var(--pc)}

.xnext{width:100%;text-align:left;display:grid;gap:6px;padding:20px 20px 18px;border-radius:32px;background:var(--pc);color:var(--onpc);margin-bottom:12px;transition:border-radius .35s var(--sp),transform .2s}
.xnext:active{border-radius:22px;transform:scale(.985)}.xnext small{font-size:12px;font-weight:600;opacity:.75}.xnext b{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.08}.xnext>span{font-size:13px;font-weight:500;opacity:.8;margin-bottom:6px}
.xnext .mo{--mf:var(--p);--mb:var(--onp)}.xnf{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.xnf i{font-style:normal;font-size:12px;font-weight:600;padding:5px 11px;border-radius:12px;background:color-mix(in srgb,var(--onpc) 10%,transparent)}
.xy{background:var(--s1);border-radius:28px;padding:14px 14px 10px;margin-bottom:12px}.xy small{display:block;font-size:11.5px;font-weight:600;color:var(--onv);margin:0 2px 10px}
.xyb{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:92px;align-items:end}.xyb>div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.xyb i{width:100%;border-radius:8px;background:var(--s3);position:relative;display:block;min-height:8px;transform-origin:bottom;animation:xrise .6s var(--e) both}.xyb u{position:absolute;top:-16px;left:0;right:0;text-align:center;text-decoration:none;font-size:10px;font-weight:600;color:var(--onv)}
.xyb .now i{background:var(--p)}.xyb .now u{color:var(--p)}.xyb span{font-size:10px;font-weight:600;color:var(--onv)}.xyb{padding-top:16px;height:108px}
@keyframes xrise{from{transform:scaleY(0)}}
.xsum button{text-align:left;transition:border-radius .35s var(--sp),outline-color .2s;outline:2px solid transparent;outline-offset:-2px}.xsum button.on{outline-color:var(--p);border-radius:14px}
.xsum button:not(.g):not(.y){background:var(--s2)}.xs{margin-bottom:10px}
.xbs{display:grid;gap:6px}.xb{display:grid;grid-template-columns:44px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:11.5px;font-weight:600}
.xb div{height:6px;border-radius:3px;background:color-mix(in srgb,currentColor 12%,transparent);overflow:hidden}.xb i{display:block;height:100%;border-radius:3px;background:currentColor;opacity:.8;transform-origin:left;animation:grow .6s var(--e) both}.xb b{text-align:right;font-weight:600}

/* ===== questions ===== */
.fqs{position:relative;margin:10px 0}.fqs input{width:100%;height:48px;border-radius:24px;background:var(--s2);padding:0 48px 0 20px;font-size:14px;font-weight:500;color:var(--on)}.fqs input:focus{outline:2px solid var(--p);outline-offset:-2px}.fqs svg{position:absolute;right:16px;top:13px;color:var(--onv);pointer-events:none}
.fq{background:var(--s1);border-radius:28px;margin-bottom:8px;overflow:hidden;transition:background .25s,border-radius .45s var(--sp);animation:fqin .5s var(--e) both;animation-delay:calc(var(--i)*35ms)}
@keyframes fqin{from{opacity:0;transform:translateY(12px) scale(.97)}}
.fq.open{background:var(--pc);color:var(--onpc);border-radius:34px}
.fqh{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:14px}
.fqh u{width:44px;height:44px;border-radius:16px;background:var(--s3);display:grid;place-items:center;text-decoration:none;transition:border-radius .45s var(--sp),background .25s,color .25s}.fq.open .fqh u{background:var(--p);color:var(--onp);border-radius:22px}
.fqh b{font-size:15px;font-weight:600;line-height:1.25;display:block}.fqh span{font-size:12px;font-weight:500;opacity:.7}
.fq.open .chv{transform:rotate(90deg)}
.fqb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--e)}.fq.open .fqb{grid-template-rows:1fr}.fqb>div{overflow:hidden;min-height:0}
.fqa{padding:2px 18px 16px;display:grid;gap:12px}.fqa p{font-size:14px;font-weight:500;line-height:1.55}
.nan .fq{animation:none}.fqa a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.fqk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.fqk div{border-radius:16px;padding:8px 10px;background:color-mix(in srgb,var(--onpc) 8%,transparent)}.fqk b{font-size:15px;font-weight:600;display:block;line-height:1.2}.fqk small{font-size:11px;font-weight:600;opacity:.75}
.fqx{display:flex;gap:8px;align-items:center}.fqx .sp{flex:1}.fq.open .chip{background:color-mix(in srgb,var(--onpc) 10%,transparent);color:inherit}
.fqx .btn.on{background:var(--p);color:var(--onp)}

  const all=matchOf(mpool()),strong=all.filter(m=>m.s>=65),poss=all.filter(m=>m.s>=40&&m.s<65),weak=all.filter(m=>m.s<40),good=strong.length+poss.length;
  if(!S.mopen&&S.mopen!==''&&all[0])S.mopen=all[0].c.id;
  const head=`<div class="mhd"><div><b>${good?'Your matches':'No matches yet'}</b><span>${stage_of(S.mstg).t} · ${strong.length} strong · ${poss.length} possible · ${S.mi.size+S.ms.size+S.mp.size+2} answers</span></div><button class="btn t sm" data-a="mretake">Retake</button></div>
    <div class="chips">${mans().map(([i,l,v])=>`<button class="chip" data-a="medit" data-v="${i}">${l}: ${v}</button>`).join('')}</div>`;
  if(!good){const mn=Math.min(...mpool().map(c=>c.fee[0])),tips=[];
    if(mn>S.mb)tips.push('Cheapest course here starts at '+lakh(mn)+'. Your budget is NPR '+S.mb+'L.');
    if(S.my)tips.push('You limited study to '+S.my+' years. Try any length.');
    if(S.mi.size&&S.ms.size)tips.push('Your interests and strengths point in different directions. Try fewer picks.');
    tips.push('Try a different stage, or loosen one answer.');
    return head+`<div class="nom">${shape(6)}<h3>Nothing fits well</h3><p>None of the ${all.length} courses at this stage scored well on your answers.</p><div class="tips">${tips.slice(0,3).map(t=>`<div>${t}</div>`).join('')}</div>
    <button class="btn f" data-a="medit" data-v="5">Change budget</button><button class="btn t" data-a="medit" data-v="1">Try another stage</button></div>`}
  let i=0;const grp=(t,l)=>l.length?`<h4>${t}</h4>`+l.map(m=>mcard(m,i++)).join(''):'';
  return head+(strong.length?'':`<div class="note">No strong match, but these are the closest. Tap one to see why.</div>`)+grp('Best fit',strong)+grp(strong.length?'Worth a look':'Closest options',poss)+
    (weak.length?`<button class="mw" data-a="mweak"><span>Not a good fit (${weak.length})</span>${I('arrow',18)}</button>${S.mweak?weak.map(m=>lrow('goCourse',m.c.id,m.c.n,m.neg.join(' · ')||m.c.f,m.s)).join(''):''}`:'')}
function renderMatch(){const box=$('#mres');if(!box)return;box.innerHTML=matchPanel()}
function qUpd(){const k=S.mstep,ms=qset(k),b=$('#qnext');if(!ms||!b)return;b.disabled=!ms.size;$('#qn').textContent=ms.size+' of 3 picked'}
function qgo(n,d){S.mstep=n;S.mdir=d;S.qa=true;msave();renderMain();S.qa=false;
  if(n===7){const T=['Reading your answers','Weighing '+mpool().length+' courses','Ranking your matches'];T.forEach((t,i)=>setTimeout(()=>{const e=$('#qlt');if(e&&S.mstep===7)e.textContent=t},i*550));setTimeout(()=>{if(S.mq&&S.mstep===7)qdone()},1700)}}
function qdone(){S.mq=false;S.medit=false;S.mstep=0;S.mdone=true;S.mopen=null;S.mweak=false;msave();render()}
const qpush=()=>{try{history.pushState({q:S.mstep},'')}catch(e){}};
function qback(){if(!S.mq)return;if(S.mstep>1&&!S.medit)qgo(S.mstep-1,-1);else{S.mq=false;S.medit=false;if(!S.mdone&&S.mstep===1)S.mstep=0;render()}}
const pick1=t=>$$('.qo',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));
const capped=(set,v,t)=>{if(!set.has(v)&&set.size>=3){if(t.animate)t.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:240});return}tog(set,v);t.classList.toggle('on');msave();qUpd()};
addEventListener('popstate',()=>{if(S.mq)qback()});
function chrome(){$('.app').classList.toggle('quiz',!!(S.view==='plan'&&S.plan==='match'&&S.mq));$('#frame').dataset.dev=S.dev;$$('#devseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.dev))}
function render(){chrome();renderTop();renderNav();renderSheet();renderMain();renderPeek()}

/* ============ ACTIONS ============ */
const clearOver=()=>{S.searching=false;S.q=''};
const select=()=>{paint();renderTop();renderPeek();renderSheet()};
// cross-links between sections remember where they came from, so Back returns there
const jump=()=>{S.back.push({view:S.view,open:S.open});if(S.back.length>8)S.back.shift()};
const A={
dev(v){S.dev=v;render()},
theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'},
nav(v){S.view=v;S.open=false;S.back=[];clearOver();render()},
stage(v){const i=STAGES.findIndex(s=>s.id===v);S.stage=v;S.stream=stage().streams[0].id;S.edu=STAGE_EDU[i];S.age=STAGE_AGE[i];S.course=S.career=S.sel=null;S.path=[];S.open=false;render()},
stream(v){S.stream=v;S.course=S.career=S.sel=null;render()},
home(){S.course=S.career=S.sel=null;render()},
foc(){S.foc=!S.foc;paint()},
lens(v){S.lens=S.lens===v?null:v;$$('.lz').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lens));lensPaint()},
course(v){if(S.course===v){S.course=null;S.sel=S.career?{t:'career',id:S.career}:null}else{S.course=v;if(S.career&&!C[v].to.includes(S.career))S.career=null;S.sel={t:'course',id:v};S.tabs.course='journey';S.cmp=null}select()},
career(v){if(S.career===v){S.career=null;S.sel=S.course?{t:'course',id:S.course}:null}else{S.career=v;if(S.course&&!C[S.course].to.includes(v))S.course=null;S.sel={t:'career',id:v};S.exp=3}select()},
open(){S.open=true;renderSheet();renderPeek()},
close(){if(S.back.length){const b=S.back.pop();S.view=b.view;S.open=b.open;render()}else{S.open=false;renderSheet();renderPeek()}},
tab(v,t){const c=cur();if(!c)return;S.tabs[c.t]=v;$$('.tabs button').forEach(b=>b.classList.toggle('on',b===t));repanel()},
seg(v,t){const s=t.closest('.split'),was=t.classList.contains('on');$$('button',s).forEach(b=>b.classList.toggle('on',!was&&b.dataset.v===v));s.classList.toggle('has',!was)},
cmp(v){S.cmp=v;repanel()},
cpriv(v){S.cpriv=v;repanel()},live(v){S.live=v;repanel()},
rung(v){S.exp=+v;updExp()},
have(v,t){tog(S.have,v);t.classList.toggle('on');const c=cur(),box=$('#rdy');if(!c||c.t!=='career'||!box)return;
  const k=K[c.id],p=Math.round(k.sk.filter(s=>S.have.has(s)).length/k.sk.length*100);$('.fg',box).style.strokeDashoffset=100-p;$('b',box).textContent=p},
save(v,t){tog(S.saved,v);t.classList.toggle('on');renderNav()},
next(v){const {st,sm}=locate(v),nx=STAGES[STAGES.indexOf(st)+1];if(!nx)return;S.path.push({stage:st.id,stream:sm.id,course:v});
  S.stage=nx.id;S.stream=nx.streams.some(x=>x.id===C[v].ns)?C[v].ns:nx.streams[0].id;S.course=S.career=S.sel=null;S.open=false;S.back=[];S.view='explore';render()},
trail(i){const p=S.path[+i];if(!p)return;S.path=S.path.slice(0,+i);S.stage=p.stage;S.stream=p.stream;S.course=p.course;S.career=null;S.sel={t:'course',id:p.course};S.tabs.course='journey';render()},
goCourse(v){if(S.view!=='explore')jump();const {st,sm}=locate(v);if(st.id!==S.stage)S.path=[];S.stage=st.id;S.stream=sm.id;S.course=v;if(S.career&&!C[v].to.includes(S.career))S.career=null;
  S.sel={t:'course',id:v};S.tabs.course='journey';S.cmp=null;S.open=true;S.view='explore';clearOver();render()},
goCareer(v){if(S.view!=='explore')jump();
  if(!stream().courses.some(c=>C[c].to.includes(v))){const c=Object.keys(C).find(c=>C[c].to.includes(v)),{st,sm}=locate(c);S.stage=st.id;S.stream=sm.id;S.course=null;S.path=[]}
  if(S.course&&!C[S.course].to.includes(v))S.course=null;S.career=v;S.sel={t:'career',id:v};S.exp=3;S.open=true;S.view='explore';clearOver();render()},
goExam(v){jump();S.view='exams';S.xg=X[v].g;S.exam=v;S.tabs.exam='stages';S.open=true;clearOver();render()},
goGuide(v){jump();S.view='guides';S.gcat='All';S.guide=v;S.open=true;clearOver();render()},
goStudy(v){S.view='study';S.study=v;S.open=false;S.back=[];clearOver();render()},
goSch(v){S.view='study';S.study='funding';S.stype='All';S.slvl='All';S.sk=null;S.schOpen=v;S.open=false;S.back=[];clearOver();render()},
find(v){S.cc=v;S.cmax=null;S.prov=S.dist=null;S.view='study';S.study='nepal';S.open=false;S.back=[];clearOver();render()},
study(v){S.study=v;renderMain()},
cc(v){S.cc=v;S.cmax=null;S.prov=S.dist=null;renderMain()},
dist(v){S.dist=v&&S.dist!==v?v:null;renderCList();if(NMAP)NMAP.update(mapCounts(),S.dist||'')},
csort(v){S.csort=v;renderMain()},
vstep(v){const k='v'+v;if(S.done.has(k))S.done.delete(k);else S.done.add(k);const l=$('#ablist');if(l)l.innerHTML=abList()},
ctry(v){S.ab=S.ab===v?null:v;const l=$('#ablist');if(l)l.innerHTML=abList();else renderMain()},
skf(v){S.sk=v||null;S.study='funding';S.stype='All';S.slvl='All';renderMain()},
stype(v){S.stype=v;renderMain()},slvl(v){S.slvl=v;renderMain()},
sch(v){S.schOpen=S.schOpen===v?null:v;renderMain()},
xg(v){S.xg=v;const l=Object.values(X).filter(x=>x.g===v);if(!l.some(x=>x.id===S.exam))S.exam=l[0].id;S.tabs.exam='stages';renderMain();renderSheet()},
edu(v){S.edu=+v;renderMain()},gv(v){S.gv=v;renderMain()},fqt(v){S.fqt=v;renderMain()},fqo(v,t){const e=t.closest('.fq'),o=e.classList.contains('open');$$('.fq.open').forEach(x=>x.classList.remove('open'));if(!o)e.classList.add('open');S.fqo=o?null:v},fqh(v,t){tog(S.fqh,v);t.classList.toggle('on')},xf(v){S.xf=S.xf===v?'all':v;$('#xlist').innerHTML=xlistHTML()},xs(v){S.xs=v;$('#xlist').innerHTML=xlistHTML()},
woman(v){S.woman=v;renderMain()},
exam(v){S.exam=v;S.tabs.exam='stages';S.open=true;renderMain();renderSheet()},
gcat(v){S.gcat=v;renderMain()},
guide(v){S.guide=v;S.open=true;renderMain();renderSheet()},
step(v,t){tog(S.done,v);t.classList.toggle('done');const g=G[v.split(':')[0]],w=gdone(g)/g.steps.length*100+'%',a=$('#gdone'),b=$('#gbar'),c=$(`.gd[data-v="${g.id}"] .gp i`);
  if(a)a.textContent=gdone(g);if(b)b.style.width=w;if(c)c.style.width=w},
doc(v,t){tog(S.docs,v);t.classList.toggle('on')},
plan(v){S.plan=v;renderMain()},
mi(v,t){capped(S.mi,v,t)},ms(v,t){capped(S.ms,v,t)},mp(v,t){capped(S.mp,v,t)},
mstart(){S.mq=true;S.medit=false;S.mstep=1;S.mdir=1;S.qa=true;qpush();render();S.qa=false},
mresume(){S.mq=true;S.mdir=1;S.qa=true;qpush();render();S.qa=false},
mretake(){S.mi=new Set();S.ms=new Set();S.mp=new Set();S.mb=15;S.my=0;S.mr='mid';S.mdone=false;S.mopen=null;A.mstart();msave()},
medit(v){S.mq=true;S.medit=true;S.mstep=+v;S.mdir=1;S.qa=true;qpush();render();S.qa=false},
mback(){if(history.state&&history.state.q)history.back();else qback()},
mnext(){if(S.medit)return qdone();if(S.mstep>=6){qpush();return qgo(7,1)}qpush();qgo(S.mstep+1,1)},
mskip(){const k=qset(S.mstep);if(k)k.clear();A.mnext()},
mstg(v,t){S.mstg=v;pick1(t);msave();if(!S.medit)setTimeout(()=>{if(S.mq&&S.mstep===1)A.mnext()},280)},
my(v,t){S.my=+v;pick1(t);msave()},mr(v,t){S.mr=v;pick1(t);msave()},
mx(v){S.mopen=S.mopen===v?'':v;renderMatch()},
mweak(){S.mweak=!S.mweak;renderMatch()},
search(){S.searching=!S.searching;S.q='';renderTop();renderMain();renderPeek();const q=$('#q');if(q)q.focus()}
};
const IN={
q(v){S.q=v.trim();renderMain();renderPeek()},
exp(v){S.exp=+v;updExp()},
cmax(v){S.cmax=+v;$('#cmaxv').textContent=lakh(S.cmax);renderCList()},
abmax(v){S.abmax=+v;$('#abv').textContent='NPR '+v+'L';$('#ablist').innerHTML=abList()},
mb(v){S.mb=+v;$('#mbv').textContent='NPR '+v+'L';const n=mpool().filter(c=>c.fee[1]<=S.mb).length;$('#mbn').textContent=n+' of '+mpool().length+' courses fit fully';msave()},
fqq(v){S.fqs=v;const b=$('#fqlist');b.classList.add('nan');b.innerHTML=faqList()},age(v){S.age=+v;$('#agev').textContent='Age '+v;$('#xlist').innerHTML=xlistHTML()},
page(v){S.age=+v;$('#pagev').textContent=v;$('#pout').innerHTML=planOut()},
hrs(v){S.hrs=+v;$('#hrv').textContent=v;$('#prepout').innerHTML=prepOut(X[S.exam])},
aid(v){S.aid=+v;$('#aidv').textContent='Aid '+v+'%';const c=cur();if(c&&c.t==='course')$('#costout').innerHTML=costOut(C[c.id])}
};
addEventListener('resize',()=>drawLinks(true));
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
document.addEventListener('input',e=>{const f=IN[e.target.id];if(f)f(e.target.value)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
new ResizeObserver(()=>drawLinks()).observe($('#main'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawLinks);
mload();
render();
</script>
