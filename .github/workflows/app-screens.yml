name: App screen captures (reel)

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Run id of a "Build Student Release APKs & AAB" run to take the APK from (blank = latest on main)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  capture:
    name: Record the app on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pick the APK build
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID="${{ inputs.apk_run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list -R "${{ github.repository }}" -w "Build Student Release APKs & AAB" -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download the APK
        uses: actions/download-artifact@v5
        with:
          pattern: NEBians-modern-v*
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: apk
          merge-multiple: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEB_USER: ${{ secrets.NEB_DEMO_USERNAME }}
          NEB_PASS: ${{ secrets.NEB_DEMO_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/reel/capture/app/run.sh

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-captures
          path: app-captures
          retention-days: 7
