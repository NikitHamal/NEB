name: Build signed release APKs

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configuration-cache=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates
            app/build/generated
            app/build/tmp
            app/build/kotlin
            build
          key: ${{ runner.os }}-android-build-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'app/src/**') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Cache Kotlin/KSP
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/transforms-3
            ~/.konan
            app/build/generated/ksp
          key: ${{ runner.os }}-ksp-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-ksp-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve metadata
        id: meta
        run: |
          set -euo pipefail
          GIT_SHA=$(git rev-parse --short=8 HEAD)
          VERSION_NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/versionName = "(.+)"/\1/')
          echo "sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build legacy (minSdk 24) release APK
        run: ./gradlew :app:assembleLegacyRelease --stacktrace

      - name: Build modern (minSdk 26) release APK
        run: ./gradlew :app:assembleModernRelease --stacktrace

      - name: Stage outputs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # AGP writes APKs to app/build/outputs/apk/<flavor>/<buildType>/*.apk
          find app/build/outputs/apk -type f -name "*.apk" -print0 |
            xargs -0 -I {} cp {} artifacts/
          ls -la artifacts/

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: NEBians-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
