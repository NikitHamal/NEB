name: Build Phonon TTS library (Android arm64)

# Builds libptts_ffi.so (Gradium Phonon, Rust, MIT OR Apache-2.0) for the app's
# on-device text to speech. The result is uploaded as an artifact and committed
# to app/src/main/jniLibs/arm64-v8a/ so the normal app build needs no Rust.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'xn-ptts tag or branch'
        required: false
        default: 'v0.6.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Phonon
        uses: actions/checkout@v7
        with:
          repository: gradium-ai/xn-ptts
          ref: ${{ github.event.inputs.ref || 'v0.6.0' }}
          path: xn-ptts

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xn-ptts/target
          key: phonon-${{ github.event.inputs.ref || 'v0.6.0' }}-${{ runner.os }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libptts_ffi.so
        working-directory: xn-ptts
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          COMMON="-C strip=symbols -C link-arg=-Wl,-z,max-page-size=16384"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="$COMMON -C target-cpu=generic -C target-feature=+dotprod,+fp16"
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          rm -rf android/jniLibs
          cargo ndk -t arm64-v8a -o android/jniLibs build --release -p ptts-ffi
          ls -la android/jniLibs/arm64-v8a

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: phonon-jnilibs
          path: xn-ptts/android/jniLibs/arm64-v8a/libptts_ffi.so
          retention-days: 30
