name: Backend tests

on:
  push:
    branches: [main]
    paths: ['backend_python/**', 'tools/css/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django tests (sqlite) + CSS bundle check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBUG: 'True'
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend_python/requirements.txt
      - name: Install
        run: pip install -r backend_python/requirements.txt bleach django-htmx meilisearch gradio_client js2py
      - name: CSS bundles are fresh
        run: python3 tools/css/bundle.py --check
      - name: Migrations are in sync
        working-directory: backend_python
        run: python3 manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: backend_python
        run: python3 manage.py test api.test_education_portfolio api.test_profile_class_level web.test_onboarding web.test_portfolio_profile web.test_auth_pages web.test_landing web.test_admin_shell --parallel 2
