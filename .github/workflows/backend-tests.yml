name: Backend tests

on:
  push:
    branches: [main]
    paths: ['backend_python/**', 'tools/css/**', 'tools/rsi/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django tests (sqlite) + CSS bundle check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBUG: 'True'
      DB_ENGINE: sqlite
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo carries multi-GB notes and PDFs; the tests read only these paths.
          sparse-checkout: |
            backend_python
            tools/css
          filter: blob:none
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend_python/requirements.txt
      - name: Install
        run: pip install -r backend_python/requirements.txt bleach django-htmx meilisearch gradio_client js2py
      - name: No undefined names (NameError guard)
        run: |
          pip install pyflakes
          python3 -m pyflakes backend_python --exclude migrations,scratch > /tmp/pyflakes.txt || true
          if grep -i "undefined name" /tmp/pyflakes.txt; then echo "undefined names found"; exit 1; fi
      - name: CSS bundles are fresh
        run: python3 tools/css/bundle.py --check
      - name: Migrations are in sync
        working-directory: backend_python
        run: python3 manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: backend_python
        run: python3 manage.py test api.test_education_portfolio api.test_institution_portfolio api.test_profile_class_level web.test_onboarding web.test_portfolio_profile web.test_auth_pages web.test_polish_regressions web.test_landing web.test_admin_shell api.test_avatar_optimize api.test_image_variants nebians.test_warmup nebians.test_crawler_shield api.test_resource_reach web.test_syllabus_practice api.test_api_query_budget api.test_replies_regression api.test_keyless_providers api.test_model_catalog api.test_inception_proxy api.test_qwencloud_parse --parallel 2
