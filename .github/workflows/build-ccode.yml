name: Build Consica Code APK

on:
  push:
    paths:
      - 'consica-code/**'
      - '.github/workflows/build-ccode.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: consica-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --build-cache
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

      - name: Get version and commit info
        id: info
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName\s*=\s*"\(.*\)"/\1/')
          HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Rename APK with commit hash
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          cp "$APK" "dist/ConsicaCode-v${{ steps.info.outputs.version }}-${{ steps.info.outputs.hash }}.apk"
          ls -la dist/

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsicaCode-v${{ steps.info.outputs.version }}-${{ steps.info.outputs.hash }}
          path: consica-code/dist/*.apk
          retention-days: 30
