name: Build AgentX Release APK

on:
  push:
    paths:
      - 'agentx/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-agentx.yml'
  workflow_dispatch:

jobs:
  build-agentx:
    name: Build AgentX App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > nebians-release.keystore

      - name: Build AgentX Release APK
        run: ./gradlew :agentx:assembleRelease --build-cache
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get version and commit info
        id: info
        run: |
          VERSION=$(grep 'versionName' agentx/build.gradle.kts | head -1 | sed 's/.*versionName\s*=\s*"\(.*\)"/\1/')
          HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload AgentX APK
        uses: actions/upload-artifact@v4
        with:
          name: AgentX-v${{ steps.info.outputs.version }}-${{ steps.info.outputs.hash }}
          path: agentx/build/outputs/apk/release/*.apk
          retention-days: 30
