name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'backend_python/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Sync files to the server using SFTP
      - name: Copy files via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: consicac
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "backend_python/"
          target: "/home/consicac/nebians_api/"
          strip_components: 1

      # 2. Run post-deployment commands via SSH
      - name: Execute post-deploy commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: consicac
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/consicac/nebians_api
            source /home/consicac/virtualenv/nebians_api/3.13/bin/activate
            pip install -r requirements.txt
            python manage.py collectstatic --noinput
            python manage.py makemigrations
            python manage.py migrate
            touch tmp/restart.txt
