name: Deploy Backend to cPanel

on:
  workflow_dispatch:

# One deploy at a time on the server (pid file lock there plus this
# workflow queue here): a second run queues, it never races the first.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The repo carries multi-GB notes/PDFs. The full fetch took 3.5 min of
          # every deploy; the deploy only reads these two paths.
          sparse-checkout: |
            backend_python
            .github/scripts
          filter: blob:none
          fetch-depth: 1

      - name: Delta deploy (same protocol as backend_python/scratch/deploy.ps1)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: consicac
          REMOTE_DIR: /home/consicac/nebians_api
        run: |
          set -euo pipefail
          echo "Host: $SSH_HOST (key injected from secrets, length ${#SSH_KEY})"
          python3 .github/scripts/deploy_backend.py
