name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'backend_python/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create ZIP archive
        run: |
          cd backend_python
          zip -r ../deploy.zip api nebians web manage.py requirements.txt passenger_wsgi.py

      - name: Copy ZIP file via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: consicac
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "deploy.zip"
          target: "/home/consicac/nebians_api/"

      - name: Deploy and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: consicac
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/consicac/nebians_api
            
            echo "Extracting deployment archive..."
            unzip -o deploy.zip
            rm -f deploy.zip
            
            source /home/consicac/virtualenv/nebians_api/3.13/bin/activate
            
            echo "Installing dependencies..."
            pip install -r requirements.txt
            
            echo "Collecting static files..."
            rm -rf staticfiles/*
            python manage.py collectstatic --noinput
            
            echo "Running database migrations..."
            python manage.py migrate
            
            echo "Resolving cPanel static files two-location copies..."
            mkdir -p public/static/web/css
            cp -f web/static/web/css/app.css public/static/web/css/app.css
            cp -f web/static/web/css/material3.css public/static/web/css/material3.css
            
            echo "Restarting Phusion Passenger application..."
            rm -rf tmp/*
            touch tmp/restart.txt
            echo "Deploy complete"
