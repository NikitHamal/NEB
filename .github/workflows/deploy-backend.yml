name: Deploy Backend to cPanel

on:
  workflow_dispatch:
    inputs:
      static_resync_dir:
        description: 'Optional one-time repair: re-copy this static dir (e.g. web/static/web/css)'
        required: false
        default: ''

# One deploy at a time on the server (pid file lock there plus this
# workflow queue here): a second run queues, it never races the first.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The repo carries multi-GB notes/PDFs. The full fetch took 3.5 min of
          # every deploy; the deploy only reads these two paths.
          sparse-checkout: |
            backend_python
            .github/scripts
          filter: blob:none
          fetch-depth: 1

      - name: Delta deploy (same protocol as backend_python/scratch/deploy.ps1)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: consicac
          STATIC_RESYNC_DIR: ${{ inputs.static_resync_dir }}
          REMOTE_DIR: /home/consicac/nebians_api
        run: |
          set -euo pipefail
          echo "Host: $SSH_HOST (key injected from secrets, length ${#SSH_KEY})"
          python3 .github/scripts/deploy_backend.py

      # Public, read-only: proves the site answers after the restart. Retries because
      # the first request after a restart forks a fresh worker pool on a loaded host.
      - name: Smoke test
        run: |
          fail=0
          for p in / /api/posts/ /api/realtime/config/ /app/news/ /static/web/css/fonts.css; do
            ok=0
            for i in 1 2 3 4; do
              out=$(curl -s -o /dev/null -m 30 -w '%{http_code} %{time_total}s' "https://nebians.consica.com.np$p" || true)
              echo "$p try $i: $out"
              case "$out" in 200*) ok=1; break;; esac
              sleep 6
            done
            [ "$ok" = 1 ] || fail=1
          done
          exit $fail
