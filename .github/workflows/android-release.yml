name: Build signed release APKs

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  release-apks:
    name: Signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build signed release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --parallel --build-cache :app:assembleMinApi23Release :app:assembleMinApi26Release

      - name: Rename APKs
        id: rename
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          COMMIT_HASH="$(git rev-parse --short HEAD)"
          mkdir -p release-apks
          for APK in app/build/outputs/apk/*/release/*.apk; do
            FLAVOR="$(basename "$(dirname "$(dirname "$APK")")")"
            cp "$APK" "release-apks/NEBians-${FLAVOR}-${VERSION_NAME}-${COMMIT_HASH}.apk"
          done
          ls -la release-apks

      - name: Upload signed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEBians-signed-release-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30
