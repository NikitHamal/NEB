name: Build Consica Code APK

on:
  push:
    paths:
      - 'consica-code/**'
      - '.github/workflows/build-consica-code.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x consica-code/gradlew

      - name: Build release APK
        working-directory: consica-code
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version and commit hash
        id: rename
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' consica-code/app/build.gradle.kts)
          APK_SRC=$(find consica-code/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          APK_NAME="ConsicaCode-v${VERSION}-${SHORT_SHA}.apk"
          mkdir -p dist
          cp "$APK_SRC" "dist/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: dist/*.apk
          retention-days: 30
