name: Build Release APKs

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version and commit info
        id: info
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT

      - name: Build API 24 Release APK
        run: ./gradlew assembleApi24Release --no-daemon --parallel --build-cache -Dorg.gradle.workers.max=2

      - name: Build API 31 Release APK
        run: ./gradlew assembleApi31Release --no-daemon --parallel --build-cache -Dorg.gradle.workers.max=2

      - name: Rename APKs
        run: |
          VERSION="${{ steps.info.outputs.version_name }}"
          COMMIT="${{ steps.info.outputs.commit_hash }}"

          mkdir -p release-apks

          find app/build/outputs/apk/api24/release -name "*.apk" -exec cp {} "release-apks/NEBians-v${VERSION}-api24-${COMMIT}.apk" \;
          find app/build/outputs/apk/api31/release -name "*.apk" -exec cp {} "release-apks/NEBians-v${VERSION}-api31-${COMMIT}.apk" \;

      - name: Upload API 24 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBians-api24-${{ steps.info.outputs.commit_hash }}
          path: release-apks/NEBians-*-api24-*.apk
          retention-days: 30

      - name: Upload API 31 APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBians-api31-${{ steps.info.outputs.commit_hash }}
          path: release-apks/NEBians-*-api31-*.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.info.outputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ steps.info.outputs.commit_hash }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APKs Generated" >> $GITHUB_STEP_SUMMARY
          ls -lh release-apks/ | tail -n +2 | awk '{print "- " $NF " (" $5 ")" }' >> $GITHUB_STEP_SUMMARY
