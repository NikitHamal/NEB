name: Build Release APKs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: nebians123
      KEY_PASSWORD: nebians123
      KEY_ALIAS: nebians
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build minApi24 Release APK
        run: |
          gradle :app:assembleMinApi24Release \
            --no-daemon \
            --build-cache \
            --configure-on-demand \
            -Dorg.gradle.jvmargs="-Xmx8192m -XX:MaxMetaspaceSize=512m"

      - name: Build minApi26 Release APK
        run: |
          gradle :app:assembleMinApi26Release \
            --no-daemon \
            --build-cache \
            --configure-on-demand \
            -Dorg.gradle.jvmargs="-Xmx8192m -XX:MaxMetaspaceSize=512m"

      - name: Rename and collect APKs
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION=$(grep "versionName" app/build.gradle.kts | head -n1 | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p outputs
          for apk in app/build/outputs/apk/minApi24/release/*.apk; do
            cp "$apk" "outputs/NEBians-${COMMIT_HASH}-${VERSION}-minApi24.apk"
          done
          for apk in app/build/outputs/apk/minApi26/release/*.apk; do
            cp "$apk" "outputs/NEBians-${COMMIT_HASH}-${VERSION}-minApi26.apk"
          done
          ls -la outputs/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebians-release-apks
          path: outputs/*.apk
          if-no-files-found: error
