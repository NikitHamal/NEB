name: Build Release APKs

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'backend_python/**'
      - '.github/workflows/deploy-backend.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/build-cache
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Grant execute permission on gradlew
        run: chmod +x gradlew

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Modern and Legacy Release APKs
        run: ./gradlew assembleModernRelease assembleLegacyRelease --no-daemon
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.parallel=true
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Get version name and commit hash
        id: app-info
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName\s*=\s*"\(.*\)"/\1/')
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME | Commit: $COMMIT_HASH"

      - name: Rename APKs with version and commit hash
        run: |
          VERSION="${{ steps.app-info.outputs.version_name }}"
          HASH="${{ steps.app-info.outputs.commit_hash }}"

          MODERN_SRC=$(find app/build/outputs/apk/modern/release -name "*.apk" | head -1)
          LEGACY_SRC=$(find app/build/outputs/apk/legacy/release -name "*.apk" | head -1)

          MODERN_DEST="app/build/outputs/apk/modern/release/NEBians-modern-v${VERSION}-${HASH}.apk"
          LEGACY_DEST="app/build/outputs/apk/legacy/release/NEBians-legacy-v${VERSION}-${HASH}.apk"

          mv "$MODERN_SRC" "$MODERN_DEST"
          mv "$LEGACY_SRC" "$LEGACY_DEST"

          echo "MODERN_APK=$MODERN_DEST" >> "$GITHUB_ENV"
          echo "LEGACY_APK=$LEGACY_DEST" >> "$GITHUB_ENV"

      - name: Display APK info and sizes
        run: |
          echo "============================================"
          echo "  NEBians Release APK Build Summary"
          echo "============================================"
          echo ""
          echo "Modern APK (minSdk 28):"
          echo "  Path: $MODERN_APK"
          echo "  Size: $(du -h "$MODERN_APK" | cut -f1)"
          echo ""
          echo "Legacy APK (minSdk 24):"
          echo "  Path: $LEGACY_APK"
          echo "  Size: $(du -h "$LEGACY_APK" | cut -f1)"
          echo ""
          echo "============================================"

      - name: Upload Modern Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBians-modern-v${{ steps.app-info.outputs.version_name }}-${{ steps.app-info.outputs.commit_hash }}
          path: ${{ env.MODERN_APK }}
          retention-days: 30

      - name: Upload Legacy Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBians-legacy-v${{ steps.app-info.outputs.version_name }}-${{ steps.app-info.outputs.commit_hash }}
          path: ${{ env.LEGACY_APK }}
          retention-days: 30
