org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
kotlin.incremental=true
ksp.incremental=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 compatibility opt-outs. The app's UI is written against the Material3
# 1.5.0-alpha API, whose Compose stack (1.8.x) cannot run on the Compose
# compiler that AGP 9's built-in Kotlin brings. Opting out keeps the Kotlin
# Android plugin and the legacy DSL so the existing source compiles unchanged
# while AGP and Gradle themselves move to latest. Both flags are documented
# opt-outs and are removed in AGP 10; migrating the Material3 Expressive call
# sites is the follow-up that lets them go.
android.builtInKotlin=false
android.newDsl=false
