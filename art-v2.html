<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBians M3X Art Library v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concepts/art-v2/v2-gallery.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <h1>M3X Art Library v2</h1>
        <small id="subcount">1,116 deterministic flat-tonal pieces across 12 UI categories</small>
      </div>
    </div>
    <div class="grow"></div>
    <div class="seg" id="views" role="group" aria-label="View mode">
      <button data-v="gallery" aria-pressed="true"><span class="ms">grid_view</span>Library</button>
      <button data-v="inapp" aria-pressed="false"><span class="ms">devices</span>In-App Preview</button>
      <button data-v="studio" aria-pressed="false"><span class="ms">tune</span>Custom Studio</button>
      <button data-v="compare" aria-pressed="false"><span class="ms">compare</span>V1 vs V2</button>
    </div>
    <label class="find">
      <span class="ms">search</span>
      <input id="q" type="search" placeholder="Search subject, scene, role or palette" autocomplete="off">
    </label>
    <button class="ibtn" id="shuf" aria-label="Shuffle seeds" title="Shuffle seeds"><span class="ms">shuffle</span></button>
    <button class="ibtn" id="mode" aria-label="Toggle theme" title="Toggle Light / Dark"><span class="ms">dark_mode</span></button>
    <a class="ibtn" href="profile-v3.html" aria-label="Profile v3" title="Open Profile v3"><span class="ms">person</span></a>
  </div>
  <nav class="rail" id="rail" role="tablist" aria-label="Art categories"></nav>
</header>

<main>
  <section class="kpis" id="kpis"></section>
  <div class="fbar" id="fbar"></div>
  <div id="stage"></div>
</main>

<div class="dlg" id="dlg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="sheet-art" id="dart"></div>
    <div class="sheet-bar">
      <div>
        <b id="dtitle" style="display:block;font-size:.95rem"></b>
        <small id="dmeta" style="color:var(--md-on-surface-variant);font-size:.76rem"></small>
      </div>
      <div id="dsw" style="display:inline-flex;gap:4px;margin-left:8px"></div>
      <span class="grow"></span>
      <button class="btn t" id="dcopy"><span class="ms">content_copy</span>Copy SVG</button>
      <button class="btn t" id="dpng"><span class="ms">image</span>2x PNG</button>
      <button class="btn f" id="ddl"><span class="ms">download</span>Download SVG</button>
      <button class="ibtn" id="dx" aria-label="Close"><span class="ms">close</span></button>
    </div>
  </div>
</div>

<!-- Load V1 engine too so the V1 vs V2 comparison tab renders live side-by-side -->
<script src="concepts/art/glyphs.js"></script>
<script src="concepts/art/art-core.js"></script>
<script src="concepts/art/art-layouts-a.js"></script>
<script src="concepts/art/art-layouts-b.js"></script>
<script src="concepts/art/art-make.js"></script>
<!-- Load M3X Art Library v2 Engine -->
<script src="concepts/art-v2/v2-core.js"></script>
<script src="concepts/art-v2/v2-scenes-sci.js"></script>
<script src="concepts/art-v2/v2-scenes-hum.js"></script>
<script src="concepts/art-v2/v2-scenes-extra.js"></script>
<script src="concepts/art-v2/v2-layouts-m3x.js"></script>
<script src="concepts/art-v2/v2-layouts-ui.js"></script>
<script src="concepts/art-v2/v2-catalog.js"></script>
<script src="concepts/art-v2/v2-previews.js"></script>
<script src="concepts/art-v2/v2-gallery.js"></script>
</body>
</html>
